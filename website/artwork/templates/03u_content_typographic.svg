  <g id="takeaway" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="100 1180 500 280"><text data-pptx-carrier="true" x="100" y="1228" fill="#14228F" font-size="42" font-family="Georgia" font-style="italic">Not every thought<tspan x="100" dy="63">needs a picture.</tspan></text></g>
  <g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="640 1190 500 300"><text data-pptx-carrier="true" x="640" y="1218" fill="#20262A">Use scale to create a clear entrance.<tspan x="640" dy="36">Let a smaller voice answer it.</tspan><tspan x="640" dy="72">Then leave enough space for the</tspan><tspan x="640" dy="36">reader to connect the two.</tspan><tspan x="640" dy="36">The pause is part of the story.</tspan></text></g>
