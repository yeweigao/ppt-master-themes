  <g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="100 245 1040 600"><text data-pptx-carrier="true" x="100" y="390" fill="#14228F" font-size="136" font-weight="bold" font-family="Georgia">Less rush.<tspan x="100" dy="157.76">More</tspan><tspan x="100" dy="157.76">attention.</tspan></text></g>
