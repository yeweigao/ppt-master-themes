  <g id="title" data-pptx-placeholder="title" data-pptx-idx="3" data-pptx-bounds="100 210 1040 200"><text data-pptx-carrier="true" x="100" y="286" fill="#14228F" font-size="76" font-weight="bold" font-family="Georgia">Learning begins<tspan x="100" dy="88.16">with attention.</tspan></text></g>
  <g id="lead" data-pptx-placeholder="subtitle" data-pptx-idx="4" data-pptx-bounds="100 430 1040 105"><text data-pptx-carrier="true" x="100" y="465" fill="#62696D" font-size="30">A shared scene. Several ways of seeing.</text></g>
  <g id="body-left" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="100 620 500 300"><text data-pptx-carrier="true" x="100" y="648" fill="#20262A">A photograph establishes a setting.<tspan x="100" dy="36">A field note records a detail. Together,</tspan><tspan x="100" dy="36">they can turn a passing impression into</tspan><tspan x="100" dy="36">a question worth taking back to a group.</tspan><tspan x="100" dy="72">Look for relationships within the scene,</tspan><tspan x="100" dy="36">not just a subject at its centre.</tspan></text></g>
  <g id="body-right" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="640 620 500 300"><text data-pptx-carrier="true" x="640" y="648" fill="#20262A">What belongs in the frame?<tspan x="640" dy="36">What would a closer view reveal?</tspan><tspan x="640" dy="36">What might someone else notice?</tspan><tspan x="640" dy="72">The purpose is not to collect answers</tspan><tspan x="640" dy="36">as quickly as possible. It is to make</tspan><tspan x="640" dy="36">better observations along the way.</tspan></text></g>
  <g id="caption" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="100 1635 850 65"><text data-pptx-carrier="true" x="100" y="1663" fill="#FFFFFF" font-size="18">PHOTO: ARCHBOB / CC0 1.0 / CROP FOR LAYOUT DEMONSTRATION</text></g>
