<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" font-size="24" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="a4-sidebar" data-pptx-layout-name="Main text and side note">
  <rect id="master-bg" data-pptx-layer="master" data-pptx-editable="false" width="1240" height="1754" fill="#FFFFFF"/>
  <line id="side-rule" data-pptx-layer="layout" data-pptx-editable="false" x1="820" y1="545" x2="1140" y2="545" stroke="#C9A227" stroke-width="3"/>
  <line id="lower-rule" data-pptx-layer="layout" data-pptx-editable="false" x1="100" y1="1325" x2="1140" y2="1325" stroke="#C8CCCF" stroke-width="1"/>
  <g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="100 100 1040 44"><text data-pptx-carrier="true" x="100" y="124" fill="#62696D" font-size="18" letter-spacing="2">02  /  A PRACTICE OF ATTENTION</text></g>
  <g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="100 210 1040 200"><text data-pptx-carrier="true" x="100" y="286" fill="#14228F" font-size="76" font-weight="bold" font-family="Georgia">A notebook is<tspan x="100" dy="88.16">a way of noticing.</tspan></text></g>
  <g id="lead" data-pptx-placeholder="subtitle" data-pptx-idx="3" data-pptx-bounds="100 435 1040 100"><text data-pptx-carrier="true" x="100" y="470" fill="#62696D" font-size="30">Give observations somewhere to become ideas.</text></g>
  <g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="100 590 680 670"><text data-pptx-carrier="true" x="100" y="618" fill="#20262A">Begin with what is actually in front of you. Describe<tspan x="100" dy="36">a space, a sound, a gesture or a material before</tspan><tspan x="100" dy="36">trying to explain it. Precise details give later</tspan><tspan x="100" dy="36">reflection something more reliable than a general</tspan><tspan x="100" dy="36">impression to work with.</tspan><tspan x="100" dy="72">Separate observation from interpretation. What did</tspan><tspan x="100" dy="36">you see? What do you think it might mean? What</tspan><tspan x="100" dy="36">would you need to ask before drawing a conclusion?</tspan><tspan x="100" dy="36">Keeping those questions distinct makes a notebook</tspan><tspan x="100" dy="36">more useful when you return to it.</tspan><tspan x="100" dy="72">A short entry can be enough: one detail, one question</tspan><tspan x="100" dy="36">and one possible connection. Leave room for an</tspan><tspan x="100" dy="36">answer that complicates the first impression.</tspan><tspan x="100" dy="72">Later, share a note with someone else. Their reading</tspan><tspan x="100" dy="36">may reveal something you did not notice yourself.</tspan></text></g>
  <g id="side-copy" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="820 590 320 670"><text data-pptx-carrier="true" x="820" y="618" fill="#20262A">TRY THIS<tspan x="820" dy="72">01  Notice a detail.</tspan><tspan x="820" dy="72">02  Describe it plainly.</tspan><tspan x="820" dy="72">03  Ask what is missing.</tspan><tspan x="820" dy="72">04  Make a connection.</tspan><tspan x="820" dy="72">Keep a distinction</tspan><tspan x="820" dy="36">between what you saw</tspan><tspan x="820" dy="36">and what you inferred.</tspan></text></g>
  <g id="takeaway" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="100 1390 1040 180"><text data-pptx-carrier="true" x="100" y="1438" fill="#14228F" font-size="40" font-family="Georgia" font-style="italic">Observe first. Interpret carefully.<tspan x="100" dy="60">Stay open to a different reading.</tspan></text></g>
  <g id="folio" data-pptx-placeholder="slide-number" data-pptx-idx="7" data-pptx-bounds="1040 1640 100 50"><text data-pptx-carrier="true" x="1040" y="1665" fill="#62696D" font-size="18">04</text></g>
</svg>