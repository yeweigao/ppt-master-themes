  <g id="step-1" data-pptx-placeholder="object" data-pptx-binding="proxy" data-pptx-idx="4" data-pptx-bounds="100 590 1040 195"><circle cx="140" cy="632" r="40" fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/><text x="140" y="642" text-anchor="middle" font-size="28" fill="#20262A">01</text><text x="280" y="630" font-size="40" fill="#14228F" font-family="Georgia" font-weight="bold">Prepare</text><text x="280" y="685" fill="#20262A">Research the issue and test your sources.<tspan x="280" dy="36">Bring a clear position and a useful question.</tspan></text></g>
  <g id="step-2" data-pptx-placeholder="object" data-pptx-binding="proxy" data-pptx-idx="5" data-pptx-bounds="100 850 1040 195"><circle cx="140" cy="892" r="40" fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/><text x="140" y="902" text-anchor="middle" font-size="28" fill="#20262A">02</text><text x="280" y="890" font-size="40" fill="#14228F" font-family="Georgia" font-weight="bold">Exchange</text><text x="280" y="945" fill="#20262A">Listen to other perspectives and explain your own.<tspan x="280" dy="36">Make the differences understandable.</tspan></text></g>
