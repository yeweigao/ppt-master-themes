  <g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="100 210 1040 200"><text data-pptx-carrier="true" x="100" y="286" fill="#14228F" font-size="76" font-weight="bold" font-family="Georgia">Give an idea<tspan x="100" dy="88.16">a path forward.</tspan></text></g>
