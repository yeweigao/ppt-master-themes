  <g id="annotation" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="820 700 320 550"><text data-pptx-carrier="true" x="820" y="728" fill="#20262A">WHAT TO READ<tspan x="820" dy="36">Photo layouts set</tspan><tspan x="820" dy="36">place and sequence.</tspan><tspan x="820" dy="72">Information layouts help</tspan><tspan x="820" dy="36">compare, locate</tspan><tspan x="820" dy="36">and explain.</tspan><tspan x="820" dy="72">Reading layouts carry</tspan><tspan x="820" dy="36">arguments and pauses.</tspan></text></g>
