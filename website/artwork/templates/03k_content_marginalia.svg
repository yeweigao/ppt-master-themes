<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" font-size="24" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="a4-marginalia" data-pptx-layout-name="Reading with anchored marginalia">
  <rect id="master-bg" data-pptx-layer="master" data-pptx-editable="false" width="1240" height="1754" fill="#FFFFFF"/>
  <line id="note-rule-a" data-pptx-layer="layout" data-pptx-editable="false" x1="820" y1="595" x2="960" y2="595" stroke="#C9A227" stroke-width="3"/>
  <line id="note-rule-b" data-pptx-layer="layout" data-pptx-editable="false" x1="820" y1="1205" x2="960" y2="1205" stroke="#C9A227" stroke-width="3"/>
  <line id="end-rule" data-pptx-layer="layout" data-pptx-editable="false" x1="100" y1="1575" x2="1140" y2="1575" stroke="#C8CCCF" stroke-width="1"/>
  <g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="100 100 1040 44"><text data-pptx-carrier="true" x="100" y="124" fill="#62696D" font-size="18" letter-spacing="2">09 / THE SECOND VOICE</text></g>
  <g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="100 220 1040 200"><text data-pptx-carrier="true" x="100" y="296" fill="#14228F" font-size="76" font-weight="bold" font-family="Georgia">The margin has<tspan x="100" dy="88.16">something to say.</tspan></text></g>
  <g id="body-top" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="100 510 680 340"><text data-pptx-carrier="true" x="100" y="538" fill="#20262A">A good note belongs beside the thought it supports.<tspan x="100" dy="36">It may define a term, locate a source or ask a useful</tspan><tspan x="100" dy="36">question. Its smaller scale creates a second voice</tspan><tspan x="100" dy="36">without interrupting the main line of the argument.</tspan><tspan x="100" dy="72">The reader can stay with the article or step aside.</tspan><tspan x="100" dy="36">Both routes remain easy to follow.</tspan></text></g>
  <g id="note-top" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="820 630 320 220"><text data-pptx-carrier="true" x="820" y="654" fill="#62696D" font-size="22">01 / CONTEXT<tspan x="820" dy="33">A note can hold a definition,</tspan><tspan x="820" dy="33">a source or a qualification.</tspan><tspan x="820" dy="33">Place it beside the passage</tspan><tspan x="820" dy="33">that gives it meaning.</tspan></text></g>
  <g id="takeaway" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="280 910 860 190"><text data-pptx-carrier="true" x="280" y="962" fill="#14228F" font-size="48" font-family="Georgia" font-style="italic">Leave space for the thought<tspan x="280" dy="72">that changes the first one.</tspan></text></g>
  <g id="body-bottom" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="100 1160 680 360"><text data-pptx-carrier="true" x="100" y="1188" fill="#20262A">Return to the same text measure after the pause.<tspan x="100" dy="36">That familiar width tells the reader where to continue.</tspan><tspan x="100" dy="36">The large statement creates a change of tempo;</tspan><tspan x="100" dy="36">the repeated column restores the underlying beat.</tspan><tspan x="100" dy="72">The margin remains a conversation, not a container</tspan><tspan x="100" dy="36">for everything that would not fit in the main text.</tspan></text></g>
  <g id="note-bottom" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="820 1240 320 280"><text data-pptx-carrier="true" x="820" y="1264" fill="#62696D" font-size="22">02 / RETURN<tspan x="820" dy="33">A repeated label helps</tspan><tspan x="820" dy="33">readers recognise the role.</tspan><tspan x="820" dy="33">A new vertical position</tspan><tspan x="820" dy="33">connects the note to its</tspan><tspan x="820" dy="33">own passage.</tspan></text></g>
  <g id="source" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="100 1620 850 70"><text data-pptx-carrier="true" x="100" y="1644" fill="#62696D" font-size="18">EDITORIAL METHOD / ILLUSTRATIVE COPY</text></g>
  <g id="folio" data-pptx-placeholder="slide-number" data-pptx-idx="9" data-pptx-bounds="1040 1640 100 50"><text data-pptx-carrier="true" x="1040" y="1665" fill="#62696D" font-size="18">13</text></g>
</svg>