  <g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="100 900 440 480"><text data-pptx-carrier="true" x="100" y="928" fill="#20262A">Water moves through the frame.<tspan x="100" dy="36">A rock, a branch and a current</tspan><tspan x="100" dy="36">create different points of entry.</tspan><tspan x="100" dy="36">Look before naming the scene.</tspan><tspan x="100" dy="72">Notice light and arrangement.</tspan><tspan x="100" dy="36">Follow an edge or a reflection.</tspan><tspan x="100" dy="36">Leave room for a closer view</tspan><tspan x="100" dy="36">to change what first seemed</tspan><tspan x="100" dy="36">important in the landscape.</tspan></text></g>
