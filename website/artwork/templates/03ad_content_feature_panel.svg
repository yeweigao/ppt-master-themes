  <rect id="title-rule" data-pptx-role="decoration" x="780" y="172" width="44" height="6" fill="#F3DC95"/>
  <g id="title" data-pptx-placeholder="title" data-pptx-idx="3" data-pptx-bounds="780 194 400 200"><text data-pptx-carrier="true" x="780" y="284" fill="#14228F" font-size="68" font-weight="bold" font-family="Georgia" letter-spacing="-1">Field notes,<tspan x="780" dy="76">kept close.</tspan></text></g>
  <g id="lead" data-pptx-placeholder="subtitle" data-pptx-idx="4" data-pptx-bounds="780 410 400 110"><text data-pptx-carrier="true" x="780" y="446" fill="#62696D" font-size="24">A white spine holds the reading;<tspan x="780" dy="32">the forest keeps the page open.</tspan></text></g>
  <g id="body" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="780 570 400 600"><text data-pptx-carrier="true" x="780" y="602" fill="#20262A" font-size="22">The photograph runs full height,<tspan x="780" dy="34">untouched by captions or grids.</tspan><tspan x="780" dy="34">A solid panel takes over the</tspan><tspan x="780" dy="34">right third, its blue rule acting</tspan><tspan x="780" dy="34">as the seam between evidence</tspan><tspan x="780" dy="34">and atmosphere.</tspan></text></g>
  <rect id="quote-rule" data-pptx-role="decoration" x="100" y="1330" width="60" height="4" fill="#F3DC95"/>
  <g id="photo-quote" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="100 1360 540 260"><text data-pptx-carrier="true" x="100" y="1430" fill="#FFFFFF" font-size="52" font-style="italic" font-family="Georgia" letter-spacing="-1">The forest keeps<tspan x="100" dy="62">its own time.</tspan></text></g>
  <g id="panel-note" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="780 1210 400 220"><text data-pptx-carrier="true" x="780" y="1258" fill="#14228F" font-size="30" font-style="italic" font-family="Georgia" letter-spacing="-0.5">Light is the subject;<tspan x="780" dy="36">the panel is the pause.</tspan></text></g>
  <g id="caption" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="780 1560 400 120"><text data-pptx-carrier="true" x="780" y="1590" fill="#62696D" font-size="16" letter-spacing="1.2">PHOTO: SPESSIG / CC0 · WOODLAND LIGHT</text></g>
