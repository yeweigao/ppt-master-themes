  <g id="event-1" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="460 530 680 240"><text data-pptx-carrier="true" x="460" y="558" fill="#20262A">PREPARE<tspan x="460" dy="36">Read about the place. Find a question worth carrying.</tspan><tspan x="460" dy="36">Identify what you know and what you need to ask.</tspan><tspan x="460" dy="72">Keep a short record of the starting point.</tspan></text></g>
