  <rect id="panel-rule" data-pptx-role="decoration" x="140" y="960" width="960" height="6" fill="#FFE500"/>
  <g id="panel-title" data-pptx-bounds="190 1000 860 200"><text letter-spacing="-1" x="190" y="1100" fill="#111111" font-size="64" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A coastline is<tspan x="190" dy="72">never finished.</tspan></text></g>
  <g id="panel-copy-left" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="190 1200 400 250"><text data-pptx-carrier="true" x="190" y="1230" fill="#111111" font-size="22">The line between water and land<tspan x="190" dy="33">is never fixed. Tide, weather and</tspan><tspan x="190" dy="33">time redraw it daily, leaving a</tspan><tspan x="190" dy="33">record that is read in layers.</tspan><tspan x="190" dy="33">Begin at the edge, then look back.</tspan></text></g>
  <g id="panel-copy-right" data-pptx-bounds="650 1200 400 250"><text x="650" y="1230" fill="#111111" font-size="22">Look for the small evidence: a<tspan x="650" dy="33">strand line, a changed edge, a</tspan><tspan x="650" dy="33">surface that holds the sky. The</tspan><tspan x="650" dy="33">coast asks for patience, not</tspan><tspan x="650" dy="33">certainty. Return at another hour.</tspan></text></g>
