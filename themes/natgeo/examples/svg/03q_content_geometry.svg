  <g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="100 100 1040 44"><text data-pptx-carrier="true" x="100" y="124" fill="#5C5C5C" font-size="18" letter-spacing="2" font-family="Arial Narrow, Arial">13 / SPACE AND COUNTERWEIGHT</text></g>
  <g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="100 210 900 204"><text letter-spacing="-1.5" data-pptx-carrier="true" x="100" y="282.9" fill="#111111" font-size="88" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A frame for<tspan x="100" dy="102.08">the natural world.</tspan></text></g>
  <g id="photo-main" data-pptx-placeholder="picture" data-pptx-idx="3" data-pptx-bounds="100 450 680 620"><image data-pptx-carrier="true" x="100" y="450" width="680" height="620" preserveAspectRatio="xMidYMid slice" href="../images/waterfall.jpg"/></g>
  <g id="note" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="820 450 390 430"><text data-pptx-carrier="true" x="820" y="478" fill="#111111">A simple geometric shape can<tspan x="820" dy="36">connect two photographs without</tspan><tspan x="820" dy="36">pretending to be a chart or a logo.</tspan><tspan x="820" dy="72">Use it as a counterweight: large,</tspan><tspan x="820" dy="36">quiet and subordinate to the</tspan><tspan x="820" dy="36">images and the text.</tspan></text></g>
  <g id="photo-detail" data-pptx-placeholder="picture" data-pptx-idx="5" data-pptx-bounds="640 950 500 560"><image data-pptx-carrier="true" x="640" y="950" width="500" height="560" preserveAspectRatio="xMidYMid slice" href="../images/woodland.jpg"/></g>
  <rect id="interlock-glaze" data-pptx-role="decoration" x="580" y="910" width="240" height="190" fill="#111111" fill-opacity="0.34"/>
  <g id="caption" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="100 1360 500 200"><text data-pptx-carrier="true" x="100" y="1386" fill="#5C5C5C" font-size="22">A dominant view sets the place.<tspan x="100" dy="33">A smaller frame holds a second</tspan><tspan x="100" dy="33">texture, while translucent geometry</tspan><tspan x="100" dy="33">bridges the two scales.</tspan></text></g>
