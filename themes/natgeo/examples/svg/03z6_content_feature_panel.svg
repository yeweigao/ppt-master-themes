<svg xmlns="http://www.w3.org/2000/svg" lang="en" viewBox="0 0 1240 1754" font-family="Arial" font-size="24" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="a4-photo-panel" data-pptx-layout-name="Full-bleed photograph with reading panel">
  <defs>
    <linearGradient id="lake-bottom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0A0A" stop-opacity="0"/><stop offset="0.55" stop-color="#0A0A0A" stop-opacity="0.4"/><stop offset="1" stop-color="#0A0A0A" stop-opacity="0.86"/></linearGradient>
  </defs>
