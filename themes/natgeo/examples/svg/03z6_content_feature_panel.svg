  <g id="hero" data-pptx-placeholder="picture" data-pptx-idx="1" data-pptx-bounds="0 0 1240 1754"><image data-pptx-carrier="true" width="1240" height="1754" preserveAspectRatio="xMidYMid slice" href="../images/lake.jpg"/></g>
  <rect id="photo-shade-bottom" data-pptx-role="decoration" x="0" y="980" width="760" height="774" fill="url(#lake-bottom)"/>
  <rect id="reading-panel" data-pptx-role="decoration" x="720" y="0" width="520" height="1754" fill="#F7F3E8"/>
  <rect id="panel-rule" data-pptx-role="decoration" x="714" y="0" width="6" height="1754" fill="#FFE500"/>
  <g id="kicker" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="780 100 400 44"><text data-pptx-carrier="true" x="780" y="124" fill="#5C5C5C" font-size="17" letter-spacing="2" font-family="Arial Narrow, Arial">13 / STILL WATER</text></g>
  <g id="title" data-pptx-placeholder="title" data-pptx-idx="3" data-pptx-bounds="780 178 400 200"><text letter-spacing="-1" data-pptx-carrier="true" x="780" y="268" fill="#111111" font-size="68" font-weight="bold" font-family="Georgia, 'Times New Roman', serif">A quiet<tspan x="780" dy="78">surface.</tspan></text></g>
  <rect id="title-rule" data-pptx-role="decoration" x="780" y="172" width="44" height="6" fill="#FFE500"/>
  <g id="lead" data-pptx-placeholder="subtitle" data-pptx-idx="4" data-pptx-bounds="780 400 400 110"><text data-pptx-carrier="true" x="780" y="436" fill="#5C5C5C" font-size="24">A lake holds the sky<tspan x="780" dy="36">long enough to study it.</tspan></text></g>
  <g id="body" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="780 560 400 720"><text data-pptx-carrier="true" x="780" y="592" fill="#111111" font-size="21">Wind, light and depth change the<tspan x="780" dy="34">surface before the eye can settle.</tspan><tspan x="780" dy="34">What looks still is usually a</tspan><tspan x="780" dy="34">balance of small movements.</tspan><tspan x="780" dy="68">Read the water from the edge</tspan><tspan x="780" dy="34">inward: the strand line, the</tspan><tspan x="780" dy="34">reflection, the place where the</tspan><tspan x="780" dy="34">bottom disappears. Each is a</tspan><tspan x="780" dy="34">different kind of evidence.</tspan><tspan x="780" dy="68">Return at another hour. The same</tspan><tspan x="780" dy="34">view will ask a different question.</tspan></text></g>
  <rect id="quote-rule" data-pptx-role="decoration" x="100" y="1330" width="60" height="4" fill="#FFE500"/>
  <g id="photo-quote" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="100 1360 540 260"><text letter-spacing="-1" data-pptx-carrier="true" x="100" y="1430" fill="#FFFFFF" font-size="52" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Stillness is<tspan x="100" dy="62">a form</tspan><tspan x="100" dy="62">of attention.</tspan></text></g>
  <g id="panel-note" data-pptx-placeholder="body" data-pptx-idx="10" data-pptx-bounds="780 1200 400 220"><text letter-spacing="-0.5" data-pptx-carrier="true" x="780" y="1248" fill="#111111" font-size="30" font-style="italic" font-family="Georgia, 'Times New Roman', serif">The surface is a<tspan x="780" dy="42">temporary agreement</tspan><tspan x="780" dy="42">between wind and light.</tspan></text></g>
  <g id="caption" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="780 1560 400 120"><text data-pptx-carrier="true" x="780" y="1590" fill="#5C5C5C" font-size="16" letter-spacing="1.2" font-family="Arial Narrow, Arial">PHOTO: BONNIE MORELAND / CC0 1.0<tspan x="780" dy="28">LAKE MOUNTAIN LANDSCAPE</tspan><tspan x="780" dy="28">PHOTOGRAPHIC PANEL STUDY</tspan></text></g>
  <g id="credit" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="100 1630 600 50"><text data-pptx-carrier="true" x="100" y="1660" fill="#FFFFFF" font-size="16" letter-spacing="1.6" font-family="Arial Narrow, Arial">CC0 1.0 / FULL-BLEED PHOTOGRAPH + READING PANEL</text></g>
