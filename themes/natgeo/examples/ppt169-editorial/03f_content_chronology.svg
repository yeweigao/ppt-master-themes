  <ns0:g id="event-4" data-pptx-placeholder="body" data-pptx-idx="10" data-pptx-bounds="944 392 256 220">
    <ns0:text data-pptx-carrier="true" x="944" y="420" fill="#111111" font-size="17" font-family="Arial, Helvetica, sans-serif">The way home.<ns0:tspan x="944" dy="25.5">Each student presents one</ns0:tspan>
      <ns0:tspan x="944" dy="25.5">photograph and one claim.</ns0:tspan>
    </ns0:text>
  </ns0:g>
