  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="80 104 1120 104">
    <ns0:text data-pptx-carrier="true" x="80" y="162" fill="#111111" font-size="44" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" letter-spacing="-1">Four days, four ways of looking.</ns0:text>
  </ns0:g>
  <ns0:g id="time-1" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="80 320 256 60">
    <ns0:text data-pptx-carrier="true" x="80" y="366" fill="#111111" font-size="32" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Day 1</ns0:text>
  </ns0:g>
  <ns0:g id="event-1" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="80 392 256 220">
    <ns0:text data-pptx-carrier="true" x="80" y="420" fill="#111111" font-size="17" font-family="Arial, Helvetica, sans-serif">The wider view.<ns0:tspan x="80" dy="25.5">Arrive, walk the shoreline</ns0:tspan>
      <ns0:tspan x="80" dy="25.5">and sketch the whole place</ns0:tspan>
      <ns0:tspan x="80" dy="25.5">before any detail.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="time-2" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="368 320 256 60">
    <ns0:text data-pptx-carrier="true" x="368" y="366" fill="#111111" font-size="32" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Day 2</ns0:text>
  </ns0:g>
  <ns0:g id="event-2" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="368 392 256 220">
    <ns0:text data-pptx-carrier="true" x="368" y="420" fill="#111111" font-size="17" font-family="Arial, Helvetica, sans-serif">The small detail.<ns0:tspan x="368" dy="25.5">One square metre of forest</ns0:tspan>
      <ns0:tspan x="368" dy="25.5">floor, recorded for an hour.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="time-3" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="656 320 256 60">
    <ns0:text data-pptx-carrier="true" x="656" y="366" fill="#111111" font-size="32" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Day 3</ns0:text>
  </ns0:g>
  <ns0:g id="event-3" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="656 392 256 220">
    <ns0:text data-pptx-carrier="true" x="656" y="420" fill="#111111" font-size="17" font-family="Arial, Helvetica, sans-serif">The shared question.<ns0:tspan x="656" dy="25.5">Groups compare notes and</ns0:tspan>
      <ns0:tspan x="656" dy="25.5">choose one thing to explain.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="time-4" data-pptx-placeholder="body" data-pptx-idx="9" data-pptx-bounds="944 320 256 60">
    <ns0:text data-pptx-carrier="true" x="944" y="366" fill="#111111" font-size="32" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Day 4</ns0:text>
