  <ns0:g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="80 366 528 240">
    <ns0:text data-pptx-carrier="true" x="80" y="392" fill="#111111" font-size="18" font-family="Arial, Helvetica, sans-serif">Water moves through the frame. A rock, a branch<ns0:tspan x="80" dy="27.0">and a current create different points of entry.</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">Look before naming the scene.</ns0:tspan>
      <ns0:tspan x="80" dy="27.0"> </ns0:tspan>
      <ns0:tspan x="80" dy="27.0">Notice light and arrangement. Follow an edge or</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">a reflection, and leave room for a closer view.</ns0:tspan>
    </ns0:text>
