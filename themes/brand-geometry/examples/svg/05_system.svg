<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="ostra-05_system" data-pptx-layout-name="One mark, six moves">
<title>One mark, six moves</title><desc>Specimen page showing six derived composition moves from the OSTRA mark.</desc>
<rect x="0" y="0" width="1240" height="1754" fill="#FFFFFF" data-pptx-role="background"/>
<g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M100 64L124 64L124 76L112 76L112 88L100 88Z"/><path d="M172 64L172 88L160 88L160 76L148 76L148 64Z"/><path d="M172 136L148 136L148 124L160 124L160 112L172 112Z"/><path d="M100 136L100 112L112 112L112 124L124 124L124 136Z"/></g><text x="180" y="84" fill="#14191C" font-size="14" letter-spacing="2.43">OSTRA / THE OPEN FRAME</text><text x="180" y="104" fill="#667077" font-size="14" letter-spacing="1.67">ARCHITECTURE / LANDSCAPE / URBANISM</text><text x="1140" y="84" fill="#667077" font-size="14" letter-spacing="2.14" text-anchor="end">SYSTEM / SIX MOVES</text><text x="1140" y="104" fill="#14191C" font-size="14" letter-spacing="2.14" text-anchor="end">05 / 08</text><text x="100" y="190" fill="#14228F" font-size="14" letter-spacing="2.51">04 / THE SYSTEM</text><text x="100" y="320" fill="#14191C" font-size="96" font-family="Georgia" font-weight="bold">One mark.</text><text x="100" y="426" fill="#14228F" font-size="96" font-family="Georgia" font-weight="bold">Six moves.</text><text x="740" y="332" fill="#667077" font-size="16">The mark is not repeated as decoration.<tspan x="740" dy="25">It is decomposed into a working vocabulary.</tspan></text><line x1="100" y1="540" x2="420" y2="540" stroke="#14228F" stroke-width="2"/><text x="100" y="568" fill="#14228F" font-size="14" letter-spacing="1.71">01 / FRAME</text><rect x="100" y="588" width="320" height="270" fill="#EEF0F4"/><g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M188 643L236 643L236 667L212 667L212 691L188 691Z"/><path d="M332 643L332 691L308 691L308 667L284 667L284 643Z"/><path d="M332 787L284 787L284 763L308 763L308 739L332 739Z"/><path d="M188 787L188 739L212 739L212 763L236 763L236 787Z"/></g><text x="100" y="890" fill="#667077" font-size="15">Complete. Measured. Never distorted.</text><line x1="100" y1="914" x2="420" y2="914" stroke="#D8D5CC" stroke-width="1"/><line x1="460" y1="540" x2="780" y2="540" stroke="#14228F" stroke-width="2"/><text x="460" y="568" fill="#14228F" font-size="14" letter-spacing="1.71">02 / OFFSET</text><rect x="460" y="588" width="320" height="270" fill="#14228F"/><g fill="#FFFFFF" fill-opacity="0.95" data-pptx-role="decoration"><path d="M546 643L590 643L590 665L568 665L568 687L546 687Z"/><path d="M678 643L678 687L656 687L656 665L634 665L634 643Z"/><path d="M678 775L634 775L634 753L656 753L656 731L678 731Z"/><path d="M546 775L546 731L568 731L568 753L590 753L590 775Z"/></g><g fill="#FFFFFF" fill-opacity="0.58" data-pptx-role="decoration"><path d="M557 654L601 654L601 676L579 676L579 698L557 698Z"/><path d="M689 654L689 698L667 698L667 676L645 676L645 654Z"/><path d="M689 786L645 786L645 764L667 764L667 742L689 742Z"/><path d="M557 786L557 742L579 742L579 764L601 764L601 786Z"/></g><g fill="#FFFFFF" fill-opacity="0.34" data-pptx-role="decoration"><path d="M568 665L612 665L612 687L590 687L590 709L568 709Z"/><path d="M700 665L700 709L678 709L678 687L656 687L656 665Z"/><path d="M700 797L656 797L656 775L678 775L678 753L700 753Z"/><path d="M568 797L568 753L590 753L590 775L612 775L612 797Z"/></g><text x="460" y="890" fill="#667077" font-size="15">Three registrations reveal the construction.</text><line x1="460" y1="914" x2="780" y2="914" stroke="#D8D5CC" stroke-width="1"/><line x1="820" y1="540" x2="1140" y2="540" stroke="#14228F" stroke-width="2"/><text x="820" y="568" fill="#14228F" font-size="14" letter-spacing="1.71">03 / RHYTHM</text><rect x="820" y="588" width="320" height="270" fill="#EEF0F4"/><rect x="858" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.12"/><rect x="886" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.175"/><rect x="914" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.22999999999999998"/><rect x="942" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.28500000000000003"/><rect x="970" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.33999999999999997"/><rect x="998" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.395"/><rect x="1026" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.45"/><rect x="1054" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.505"/><rect x="1082" y="628" width="10" height="174" fill="#14228F" fill-opacity="0.56"/><text x="820" y="890" fill="#667077" font-size="15">The 1-unit arm becomes a repeatable interval.</text><line x1="820" y1="914" x2="1140" y2="914" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="1010" x2="420" y2="1010" stroke="#14228F" stroke-width="2"/><text x="100" y="1038" fill="#14228F" font-size="14" letter-spacing="1.71">04 / CROP</text><rect x="100" y="1058" width="320" height="270" fill="#EEF0F4"/><g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M140 1070L240 1070L240 1120L190 1120L190 1170L140 1170Z"/><path d="M420 1070L420 1170L390 1170L390 1120L340 1120L340 1070Z"/><path d="M420 1328L340 1328L340 1320L390 1320L390 1270L420 1270Z"/><path d="M140 1328L140 1270L190 1270L190 1320L240 1320L240 1328Z"/></g><rect x="100" y="1058" width="320" height="270" fill="none" stroke="#D8D5CC" stroke-width="1"/><text x="100" y="1360" fill="#667077" font-size="15">Scale until the mark becomes a structure.</text><line x1="100" y1="1384" x2="420" y2="1384" stroke="#D8D5CC" stroke-width="1"/><line x1="460" y1="1010" x2="780" y2="1010" stroke="#14228F" stroke-width="2"/><text x="460" y="1038" fill="#14228F" font-size="14" letter-spacing="1.71">05 / WINDOW</text><rect x="460" y="1058" width="320" height="270" fill="#EEF0F4"/><image x="490" y="1088" width="260" height="210" preserveAspectRatio="xMidYMid slice" href="../images/waterfall.jpg"/><g fill="#FFFFFF" fill-opacity="0.94" data-pptx-role="decoration"><path d="M490 1088L542 1088L542 1114L516 1114L516 1140L490 1140Z"/></g><g fill="none" stroke="#14228F" stroke-width="1.5" stroke-opacity="0.8"><path d="M750 1298L698 1298L698 1272L724 1272L724 1246L750 1246Z"/></g><text x="460" y="1360" fill="#667077" font-size="15">Let an image pass through the opening.</text><line x1="460" y1="1384" x2="780" y2="1384" stroke="#D8D5CC" stroke-width="1"/><line x1="820" y1="1010" x2="1140" y2="1010" stroke="#14228F" stroke-width="2"/><text x="820" y="1038" fill="#14228F" font-size="14" letter-spacing="1.71">06 / FIELD</text><rect x="820" y="1058" width="320" height="270" fill="#EEF0F4"/><g fill="#14228F" fill-opacity="0.22" data-pptx-role="decoration"><path d="M882 1095L898 1095L898 1103L890 1103L890 1111L882 1111Z"/><path d="M930 1095L930 1111L922 1111L922 1103L914 1103L914 1095Z"/><path d="M930 1143L914 1143L914 1135L922 1135L922 1127L930 1127Z"/><path d="M882 1143L882 1127L890 1127L890 1135L898 1135L898 1143Z"/></g><g fill="#14228F" fill-opacity="0.22" data-pptx-role="decoration"><path d="M954 1095L970 1095L970 1103L962 1103L962 1111L954 1111Z"/><path d="M1002 1095L1002 1111L994 1111L994 1103L986 1103L986 1095Z"/><path d="M1002 1143L986 1143L986 1135L994 1135L994 1127L1002 1127Z"/><path d="M954 1143L954 1127L962 1127L962 1135L970 1135L970 1143Z"/></g><g fill="#14228F" fill-opacity="0.22" data-pptx-role="decoration"><path d="M1026 1095L1042 1095L1042 1103L1034 1103L1034 1111L1026 1111Z"/><path d="M1074 1095L1074 1111L1066 1111L1066 1103L1058 1103L1058 1095Z"/><path d="M1074 1143L1058 1143L1058 1135L1066 1135L1066 1127L1074 1127Z"/><path d="M1026 1143L1026 1127L1034 1127L1034 1135L1042 1135L1042 1143Z"/></g><g fill="#14228F" fill-opacity="0.22" data-pptx-role="decoration"><path d="M882 1167L898 1167L898 1175L890 1175L890 1183L882 1183Z"/><path d="M930 1167L930 1183L922 1183L922 1175L914 1175L914 1167Z"/><path d="M930 1215L914 1215L914 1207L922 1207L922 1199L930 1199Z"/><path d="M882 1215L882 1199L890 1199L890 1207L898 1207L898 1215Z"/></g><g fill="#14228F" fill-opacity="0.22" data-pptx-role="decoration"><path d="M954 1167L970 1167L970 1175L962 1175L962 1183L954 1183Z"/><path d="M1002 1167L1002 1183L994 1183L994 1175L986 1175L986 1167Z"/><path d="M1002 1215L9