<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="ostra-02_identity" data-pptx-layout-name="A mark is a plan">
<title>A mark is a plan</title><desc>Measured construction drawing and three states of the OSTRA mark.</desc>
<rect x="0" y="0" width="1240" height="1754" fill="#FFFFFF" data-pptx-role="background"/>
<g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M100 64L124 64L124 76L112 76L112 88L100 88Z"/><path d="M172 64L172 88L160 88L160 76L148 76L148 64Z"/><path d="M172 136L148 136L148 124L160 124L160 112L172 112Z"/><path d="M100 136L100 112L112 112L112 124L124 124L124 136Z"/></g><text x="180" y="84" fill="#14191C" font-size="14" letter-spacing="2.43">OSTRA / THE OPEN FRAME</text><text x="180" y="104" fill="#667077" font-size="14" letter-spacing="1.67">ARCHITECTURE / LANDSCAPE / URBANISM</text><text x="1140" y="84" fill="#667077" font-size="14" letter-spacing="2.14" text-anchor="end">IDENTITY / CONSTRUCTION</text><text x="1140" y="104" fill="#14191C" font-size="14" letter-spacing="2.14" text-anchor="end">02 / 08</text><text x="100" y="190" fill="#14228F" font-size="14" letter-spacing="2.51">01 / IDENTITY CONSTRUCTION</text><text x="100" y="300" fill="#14191C" font-size="88" font-family="Georgia" font-weight="bold">A mark is a plan.</text><text x="100" y="366" fill="#667077" font-size="18">Four corner brackets, drawn on a six-unit field. Each arm is two units long, one unit thick.<tspan x="100" dy="27">The opening is not empty; it is the subject.</tspan></text><line x1="100" y1="540" x2="100" y2="876" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="540" x2="436" y2="540" stroke="#D8D5CC" stroke-width="1"/><line x1="156" y1="540" x2="156" y2="876" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="596" x2="436" y2="596" stroke="#D8D5CC" stroke-width="1"/><line x1="212" y1="540" x2="212" y2="876" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="652" x2="436" y2="652" stroke="#D8D5CC" stroke-width="1"/><line x1="268" y1="540" x2="268" y2="876" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="708" x2="436" y2="708" stroke="#D8D5CC" stroke-width="1"/><line x1="324" y1="540" x2="324" y2="876" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="764" x2="436" y2="764" stroke="#D8D5CC" stroke-width="1"/><line x1="380" y1="540" x2="380" y2="876" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="820" x2="436" y2="820" stroke="#D8D5CC" stroke-width="1"/><line x1="436" y1="540" x2="436" y2="876" stroke="#D8D5CC" stroke-width="1"/><line x1="100" y1="876" x2="436" y2="876" stroke="#D8D5CC" stroke-width="1"/><g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M100 540L212 540L212 596L156 596L156 652L100 652Z"/><path d="M436 540L436 652L380 652L380 596L324 596L324 540Z"/><path d="M436 876L324 876L324 820L380 820L380 764L436 764Z"/><path d="M100 876L100 764L156 764L156 820L212 820L212 876Z"/></g><line x1="100" y1="496" x2="436" y2="496" stroke="#A98B28" stroke-width="1"/><line x1="100" y1="488" x2="100" y2="504" stroke="#A98B28" stroke-width="1"/><line x1="436" y1="488" x2="436" y2="504" stroke="#A98B28" stroke-width="1"/><text x="268" y="486" fill="#A98B28" font-size="14" letter-spacing="1.57" text-anchor="middle">6u</text><line x1="56" y1="540" x2="56" y2="876" stroke="#A98B28" stroke-width="1"/><line x1="48" y1="540" x2="64" y2="540" stroke="#A98B28" stroke-width="1"/><line x1="48" y1="876" x2="64" y2="876" stroke="#A98B28" stroke-width="1"/><text x="46" y="708" fill="#A98B28" font-size="14" letter-spacing="1.57" text-anchor="middle">6u</text><line x1="212" y1="910" x2="324" y2="910" stroke="#A98B28" stroke-width="1"/><text x="268" y="934" fill="#A98B28" font-size="14" letter-spacing="1.43" text-anchor="middle">OPENING / 2u</text><line x1="460" y1="540" x2="460" y2="596" stroke="#A98B28" stroke-width="1"/><text x="472" y="548" fill="#A98B28" font-size="14" letter-spacing="1.29">FRAME / 1u</text><text x="472" y="570" fill="#A98B28" font-size="14" letter-spacing="1.29">ARM / 2u</text><text x="472" y="592" fill="#A98B28" font-size="14" letter-spacing="1.29">GAP / 2u</text><text x="600" y="526" fill="#14228F" font-size="14" letter-spacing="2.36">THE MARK IN USE</text><rect x="600" y="548" width="250" height="168" fill="#FFFFFF" stroke="#D8D5CC" stroke-width="1"/><text x="620" y="574" fill="#667077" font-size="14" letter-spacing="1.22">PRIMARY / ON PAPER</text><g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M671 592L707 592L707 610L689 610L689 628L671 628Z"/><path d="M779 592L779 628L761 628L761 610L743 610L743 592Z"/><path d="M779 700L743 700L743 682L761 682L761 664L779 664Z"/><path d="M671 700L671 664L689 664L689 682L707 682L707 700Z"/></g><rect x="880" y="548" width="260" height="168" fill="#14228F"/><text x="900" y="574" fill="#FFFFFF" font-size="14" letter-spacing="1.22">REVERSED / ON FIELD</text><g fill="#FFFFFF" fill-opacity="1.0" data-pptx-role="decoration"><path d="M956 592L992 592L992 610L974 610L974 628L956 628Z"/><path d="M1064 592L1064 628L1046 628L1046 610L1028 610L1028 592Z"/><path d="M1064 700L1028 700L1028 682L1046 682L1046 664L1064 664Z"/><path d="M956 700L956 664L974 664L974 682L992 682L992 700Z"/></g><rect x="600" y="750" width="540" height="190" fill="#E4E8F2"/><text x="620" y="780" fill="#14228F" font-size="14" letter-spacing="1.22">CROPPED / AT THE EDGE</text><g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M1020 760L1076 760L1076 788L1048 788L1048 816L1020 816Z"/><path d="M1140 760L1140 788L1132 788L1132 760Z"/><path d="M1140 928L1132 928L1132 900L1140 900Z"/><path d="M1020 928L1020 872L1048 872L1048 900L1076 900L1076 928Z"/></g><rect x="600" y="750" width="540" height="190" fill="none" stroke="#D8D5CC" stroke-width="1"/><text x="600" y="968" fill="#667077" font-size="14">One frame, three registers. The crop is never an accident.</text><line x1="600" y1="1000" x2="1140" y2="1000" stroke="#D8D5CC" stroke-width="1"/><text x="600" y="1054" fill="#14191C" font-size="26" font-family="Georgia" font-weight="bold">The rule</text><text x="600" y="1102" fill="#14228F" font-size="24" font-family="Georgia" font-weight="bold">6u</text><text x="678" y="1102" fill="#667077" font-size="14.5">field. The same measure as the page&#x27;s six tracks.</text><line x1="600" y1="1130" x2="1140" y2="1130" stroke="#D8D5CC" stroke-width="1"/><text x="600" y="1162" fill="#14228F" font-size="24" font-family="Georgia" font-weight="bold">2:1</text><text x="678" y="1162" fill="#667077" font-size="14.5">arm. Long enough to carry a crop, short enough to read as a corner.</text><line x1="600" y1="1190" x2="1140" y2="1190" stroke="#D8D5CC" stroke-width="1"/><text x="600" y="1222" fill="#14228F" font-size="24" font-family="Georgia" font-weight="bold">1u</text><text x="678" y="1222" fill="#667077" font-size="14.5">frame. The thickness never changes with scale.</text><text x="600" y="1268" fill="#14191C" font-size="17">The mark is never redrawn. It is measured, cropped,<tspan x="600" dy="26">repeated and allowed to meet the site.</tspan></text><line x1="100" y1="1040" x2="540" y2="1040" stroke="#A98B28" stroke-width="2"/><text x="100" y="1122" fill="#14191C" font-size="44" font-family="Georgia" font-weight="italic">Construction<tspan x="100" dy="52">is the identity.</tspan></text><text x="100" y="1250" fill="#667077" font-size="16">Every page keeps one measurable relationship to the<tspan x="100" dy="25">frame; recognition comes from the interval, not</tspan><tspan x="100" dy="25">the ornament.</tspan></text><line x1="100" y1="1440" x2="1140" y2="1440" stroke="#D8D5CC" stroke-width="1"/><text x="100" y="1512" fill="#14191C" font-size="38" font-family="Georgia" font-weight="italic">The frame is the argument. The opening is the work.</text><line x1="100" y1="1648" x2="1140" y2="1648" stroke="#D8D5CC" stroke-width="1"/><text x="100" y="1680" fill="#14191C" font-size="14" letter-spacing="2.57">OSTRA</text><text x="160" y="1680" fill="#667077" font-size="14" letter-spacing="1.41">FICTIONAL IDENTITY STUDY / DEMONSTRATION ONLY</text><text x="1140" y="1680" fill="#14191C" font-size="14" letter-spacing="2.14" text-anchor="end">02 / 08</text>
</svg>
