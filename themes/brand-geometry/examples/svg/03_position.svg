<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="ostra-03_position" data-pptx-layout-name="We design the space between">
<title>We design the space between</title><desc>Manifesto page with a cropped brand fragment and a clear reading field.</desc>
<rect x="0" y="0" width="1240" height="1754" fill="#FFFFFF" data-pptx-role="background"/>
<g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M100 64L124 64L124 76L112 76L112 88L100 88Z"/><path d="M172 64L172 88L160 88L160 76L148 76L148 64Z"/><path d="M172 136L148 136L148 124L160 124L160 112L172 112Z"/><path d="M100 136L100 112L112 112L112 124L124 124L124 136Z"/></g><text x="180" y="84" fill="#14191C" font-size="10" letter-spacing="3.4">OSTRA / THE OPEN FRAME</text><text x="180" y="104" fill="#667077" font-size="9" letter-spacing="2.6">ARCHITECTURE / LANDSCAPE / URBANISM</text><text x="1140" y="84" fill="#667077" font-size="10" letter-spacing="3" text-anchor="end">POSITION / THE IN-BETWEEN</text><text x="1140" y="104" fill="#14191C" font-size="10" letter-spacing="3" text-anchor="end">03 / 08</text><text x="100" y="190" fill="#14228F" font-size="11" letter-spacing="3.2">02 / POSITION</text><text x="100" y="400" fill="#14191C" font-size="112" font-family="Georgia" font-weight="bold">We design<tspan x="100" dy="118">the space</tspan><tspan x="100" dy="118">between.</tspan></text><line x1="840" y1="180" x2="840" y2="480" stroke="#D8D5CC" stroke-width="1"/><line x1="840" y1="180" x2="1140" y2="180" stroke="#D8D5CC" stroke-width="1"/><line x1="890" y1="180" x2="890" y2="480" stroke="#D8D5CC" stroke-width="1"/><line x1="840" y1="230" x2="1140" y2="230" stroke="#D8D5CC" stroke-width="1"/><line x1="940" y1="180" x2="940" y2="480" stroke="#D8D5CC" stroke-width="1"/><line x1="840" y1="280" x2="1140" y2="280" stroke="#D8D5CC" stroke-width="1"/><line x1="990" y1="180" x2="990" y2="480" stroke="#D8D5CC" stroke-width="1"/><line x1="840" y1="330" x2="1140" y2="330" stroke="#D8D5CC" stroke-width="1"/><line x1="1040" y1="180" x2="1040" y2="480" stroke="#D8D5CC" stroke-width="1"/><line x1="840" y1="380" x2="1140" y2="380" stroke="#D8D5CC" stroke-width="1"/><line x1="1090" y1="180" x2="1090" y2="480" stroke="#D8D5CC" stroke-width="1"/><line x1="840" y1="430" x2="1140" y2="430" stroke="#D8D5CC" stroke-width="1"/><line x1="1140" y1="180" x2="1140" y2="480" stroke="#D8D5CC" stroke-width="1"/><line x1="840" y1="480" x2="1140" y2="480" stroke="#D8D5CC" stroke-width="1"/><g fill="none" stroke="#14228F" stroke-width="1" stroke-opacity="0.55"><path d="M840 180L940 180L940 230L890 230L890 280L840 280Z"/><path d="M1140 180L1140 280L1090 280L1090 230L1040 230L1040 180Z"/><path d="M1140 480L1040 480L1040 430L1090 430L1090 380L1140 380Z"/><path d="M840 480L840 380L890 380L890 430L940 430L940 480Z"/></g><g fill="#14228F" fill-opacity="0.92" data-pptx-role="decoration"><path d="M840 180L940 180L940 230L890 230L890 280L840 280Z"/></g><text x="990" y="162" fill="#14228F" font-size="9" letter-spacing="2" text-anchor="middle">6u FIELD / 1u FRAME</text><line x1="100" y1="800" x2="620" y2="800" stroke="#A98B28" stroke-width="2"/><text x="100" y="872" fill="#667077" font-size="18">A building begins with a line. A place begins<tspan x="100" dy="29">with the space that line leaves open. OSTRA</tspan><tspan x="100" dy="29">works between structure and ground — reading</tspan><tspan x="100" dy="29">the site before drawing the frame.</tspan></text><text x="700" y="872" fill="#667077" font-size="18">Between architecture, landscape and urbanism.<tspan x="700" dy="29">One measure keeps many voices in the room:</tspan><tspan x="700" dy="29">the width of a path, the depth of a threshold,</tspan><tspan x="700" dy="29">the interval between trees.</tspan></text><text x="100" y="1092" fill="#14191C" font-size="20">We are less interested in the object than in what it frames.</text><g fill="#14228F" fill-opacity="0.9" data-pptx-role="decoration"><path d="M1020 1040L1180 1040L1180 1120L1100 1120L1100 1200L1020 1200Z"/><path d="M1020 1520L1020 1360L1100 1360L1100 1440L1180 1440L1180 1520Z"/></g><g fill="#14228F" fill-opacity="0.22" data-pptx-role="decoration"><path d="M1060 1080L1220 1080L1220 1160L1140 1160L1140 1240L1060 1240Z"/><path d="M1060 1560L1060 1400L1140 1400L1140 1480L1220 1480L1220 1560Z"/></g><g fill="#14228F" fill-opacity="0.1" data-pptx-role="decoration"><path d="M1100 1120L1260 1120L1260 1200L1180 1200L1180 1280L1100 1280Z"/><path d="M1100 1600L1100 1440L1180 1440L1180 1520L1260 1520L1260 1600Z"/></g><line x1="100" y1="1270" x2="780" y2="1270" stroke="#D8D5CC" stroke-width="1"/><text x="100" y="1360" fill="#14191C" font-size="38" font-family="Georgia" font-weight="italic">A frame is not a border.<tspan x="100" dy="52">It is a decision about what to leave open.</tspan></text><text x="100" y="1490" fill="#667077" font-size="9.5" letter-spacing="2.6">THE OPEN FRAME / NOTES ON PRACTICE</text><line x1="100" y1="1648" x2="1140" y2="1648" stroke="#D8D5CC" stroke-width="1"/><text x="100" y="1680" fill="#14191C" font-size="10" letter-spacing="3.6">OSTRA</text><text x="160" y="1680" fill="#667077" font-size="9" letter-spacing="2.2">FICTIONAL IDENTITY STUDY / DEMONSTRATION ONLY</text><text x="1140" y="1680" fill="#14191C" font-size="10" letter-spacing="3" text-anchor="end">03 / 08</text>
</svg>
