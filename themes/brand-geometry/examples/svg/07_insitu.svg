<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="ostra-07_insitu" data-pptx-layout-name="The plan is a way of seeing">
<title>The plan is a way of seeing</title><desc>Dark site-logic page with outlined mark, photograph and measured metrics.</desc>
<rect x="0" y="0" width="1240" height="1754" fill="#0E1530" data-pptx-role="background"/>
<g fill="#FFFFFF" fill-opacity="1.0" data-pptx-role="decoration"><path d="M100 64L124 64L124 76L112 76L112 88L100 88Z"/><path d="M172 64L172 88L160 88L160 76L148 76L148 64Z"/><path d="M172 136L148 136L148 124L160 124L160 112L172 112Z"/><path d="M100 136L100 112L112 112L112 124L124 124L124 136Z"/></g><text x="180" y="84" fill="#FFFFFF" font-size="10" letter-spacing="3.4">OSTRA / THE OPEN FRAME</text><text x="180" y="104" fill="#B9C2D4" font-size="9" letter-spacing="2.6">ARCHITECTURE / LANDSCAPE / URBANISM</text><text x="1140" y="84" fill="#B9C2D4" font-size="10" letter-spacing="3" text-anchor="end">IN SITU / SITE LOGIC</text><text x="1140" y="104" fill="#FFFFFF" font-size="10" letter-spacing="3" text-anchor="end">07 / 08</text><text x="100" y="190" fill="#A98B28" font-size="11" letter-spacing="3.2">06 / IN SITU</text><text x="100" y="338" fill="#FFFFFF" font-size="92" font-family="Georgia" font-weight="bold">The plan is</text><text x="100" y="440" fill="#FFFFFF" font-size="92" font-family="Georgia" font-weight="bold">a way of</text><text x="100" y="542" fill="#A98B28" font-size="92" font-family="Georgia" font-weight="italic">seeing.</text><text x="100" y="640" fill="#D5DBE8" font-size="19">A plan is not a smaller drawing of a building.<tspan x="100" dy="30">It is a proposal for attention: what to keep,</tspan><tspan x="100" dy="30">what to open, what to leave alone.</tspan></text><image x="640" y="300" width="500" height="660" preserveAspectRatio="xMidYMid slice" href="../images/horizon.jpg"/><rect x="640" y="300" width="500" height="660" fill="#0E1530" fill-opacity="0.28"/><g fill="#A98B28" fill-opacity="0.95" data-pptx-role="decoration"><path d="M640 300H688V324H664V348H640Z"/><path d="M1140 300H1092V324H1116V348H1140Z"/><path d="M1140 960H1092V936H1116V912H1140Z"/><path d="M640 960H688V936H664V912H640Z"/></g><text x="640" y="988" fill="#FFFFFF" font-size="9" letter-spacing="2.4">EDGE CONDITION / 01</text><line x1="100" y1="1040" x2="540" y2="1040" stroke="#43506B" stroke-width="1"/><text x="100" y="1102" fill="#FFFFFF" font-size="24" font-family="Georgia">What we build is a way of looking.<tspan x="100" dy="34">The rest is maintenance.</tspan></text><text x="100" y="1330" fill="#A98B28" font-size="58" font-family="Georgia" font-weight="bold">04</text><text x="100" y="1358" fill="#AEB8CA" font-size="9" letter-spacing="2.4">SITES</text><text x="260" y="1330" fill="#A98B28" font-size="58" font-family="Georgia" font-weight="bold">03</text><text x="260" y="1358" fill="#AEB8CA" font-size="9" letter-spacing="2.4">CLIMATES</text><text x="420" y="1330" fill="#A98B28" font-size="58" font-family="Georgia" font-weight="bold">01</text><text x="420" y="1358" fill="#AEB8CA" font-size="9" letter-spacing="2.4">FRAME</text><text x="640" y="1330" fill="#D5DBE8" font-size="18">The mark is not applied to the site.<tspan x="640" dy="28">It is calibrated to it.</tspan></text><text x="100" y="1540" fill="#AEB8CA" font-size="9" letter-spacing="2.4">SITE LOG / NORTH COAST / 2026</text><text x="1140" y="1540" fill="#AEB8CA" font-size="9" letter-spacing="2.4" text-anchor="end">THE OPEN FRAME / 6u</text><line x1="100" y1="1648" x2="1140" y2="1648" stroke="#43506B" stroke-width="1"/><text x="100" y="1680" fill="#FFFFFF" font-size="10" letter-spacing="3.6">OSTRA</text><text x="160" y="1680" fill="#AEB8CA" font-size="9" letter-spacing="2.2">FICTIONAL IDENTITY STUDY / DEMONSTRATION ONLY</text><text x="1140" y="1680" fill="#FFFFFF" font-size="10" letter-spacing="3" text-anchor="end">07 / 08</text>
</svg>
