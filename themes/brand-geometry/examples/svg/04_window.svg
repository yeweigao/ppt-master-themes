<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-master="a4-editorial" data-pptx-master-name="A4 Editorial" data-pptx-layout="ostra-04_window" data-pptx-layout-name="The frame reveals the view">
<title>The frame reveals the view</title><desc>Full-bleed site photograph with white and blue crop geometry derived from the mark.</desc>
<rect x="0" y="0" width="1240" height="1754" fill="#FFFFFF" data-pptx-role="background"/>
<g fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration"><path d="M100 64L124 64L124 76L112 76L112 88L100 88Z"/><path d="M172 64L172 88L160 88L160 76L148 76L148 64Z"/><path d="M172 136L148 136L148 124L160 124L160 112L172 112Z"/><path d="M100 136L100 112L112 112L112 124L124 124L124 136Z"/></g><text x="180" y="84" fill="#14191C" font-size="10" letter-spacing="3.4">OSTRA / THE OPEN FRAME</text><text x="180" y="104" fill="#667077" font-size="9" letter-spacing="2.6">ARCHITECTURE / LANDSCAPE / URBANISM</text><text x="1140" y="84" fill="#667077" font-size="10" letter-spacing="3" text-anchor="end">SITE / THE OPENING</text><text x="1140" y="104" fill="#14191C" font-size="10" letter-spacing="3" text-anchor="end">04 / 08</text><text x="100" y="190" fill="#14228F" font-size="11" letter-spacing="3.2">03 / SITE</text><text x="100" y="286" fill="#14191C" font-size="62" font-family="Georgia" font-weight="bold">The frame does not</text><text x="100" y="356" fill="#14191C" font-size="62" font-family="Georgia" font-weight="bold">hold the view.</text><text x="100" y="426" fill="#14228F" font-size="62" font-family="Georgia" font-weight="italic">It reveals it.</text><text x="100" y="472" fill="#667077" font-size="16">A single opening, cut into a working landscape. The geometry does not cover the image; it gives the eye a place to begin.</text><image x="100" y="540" width="1040" height="860" preserveAspectRatio="xMidYMid slice" href="../images/lake.jpg"/><g fill="#FFFFFF" fill-opacity="0.88" data-pptx-role="decoration"><path d="M100 540L320 540L320 650L210 650L210 760L100 760Z"/></g><g fill="#FFFFFF" fill-opacity="0.88" data-pptx-role="decoration"><path d="M1140 1400L920 1400L920 1290L1030 1290L1030 1180L1140 1180Z"/></g><text x="100" y="1460" fill="#14191C" font-size="18">Moss Pavilion sits at the edge of a clearing. The frame opens north<tspan x="100" dy="27">to the water; the reading bench follows the shade line.</tspan></text><text x="100" y="1540" fill="#667077" font-size="9" letter-spacing="2.2">PHOTO: BONNIE MORELAND / CC0 1.0</text><text x="1140" y="1460" fill="#14228F" font-size="10" letter-spacing="2.6" text-anchor="end">SITE STUDY 01</text><text x="1140" y="1484" fill="#667077" font-size="9" letter-spacing="2.2" text-anchor="end">LAKE / 2026</text><line x1="100" y1="1648" x2="1140" y2="1648" stroke="#D8D5CC" stroke-width="1"/><text x="100" y="1680" fill="#14191C" font-size="10" letter-spacing="3.6">OSTRA</text><text x="160" y="1680" fill="#667077" font-size="9" letter-spacing="2.2">FICTIONAL IDENTITY STUDY / DEMONSTRATION ONLY</text><text x="1140" y="1680" fill="#14191C" font-size="10" letter-spacing="3" text-anchor="end">04 / 08</text>
