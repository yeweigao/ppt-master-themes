  <ns0:g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="80 48 1120 36">
    <ns0:text data-pptx-carrier="true" x="124" y="72" fill="#14191C" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.4">OSTRA  /  POSITION</ns0:text>
  </ns0:g>
  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="80 108 1120 110">
    <ns0:text data-pptx-carrier="true" x="80" y="166" fill="#14191C" font-size="44" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" letter-spacing="-1">We design the space between.</ns0:text>
  </ns0:g>
  <ns0:g id="lead" data-pptx-placeholder="subtitle" data-pptx-idx="3" data-pptx-bounds="80 226 1120 64">
    <ns0:text data-pptx-carrier="true" x="80" y="258" fill="#667077" font-size="20" font-family="Arial, Helvetica, sans-serif">A building begins with a line. A place begins with the space that line leaves open.</ns0:text>
  </ns0:g>
  <ns0:g id="body-left" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="80 306 544 306">
    <ns0:text data-pptx-carrier="true" x="80" y="334" fill="#14191C" font-size="18" font-family="Arial, Helvetica, sans-serif">OSTRA works between structure and ground:<ns0:tspan x="80" dy="27.0">reading the site before drawing the frame,</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">and drawing the frame before choosing a</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">material. One measure keeps many voices</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">in the room.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="body-right" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="656 306 544 306">
    <ns0:text data-pptx-carrier="true" x="656" y="334" fill="#14191C" font-size="18" font-family="Arial, Helvetica, sans-serif">We are less interested in the object than in<ns0:tspan x="656" dy="27.0">what it frames. That is why the mark is never</ns0:tspan>
      <ns0:tspan x="656" dy="27.0">closed: its centre is the work — a lake, a</ns0:tspan>
      <ns0:tspan x="656" dy="27.0">ridge, a clearing. The four brackets only</ns0:tspan>
      <ns0:tspan x="656" dy="27.0">say where to stand.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="source" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="80 644 900 32">
    <ns0:text data-pptx-carrier="true" x="80" y="668" fill="#667077" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.4">OSTRA IS A FICTIONAL PRACTICE  ·  DEMONSTRATION COPY</ns0:text>
