  <ns0:path d="M 80 54 L 90 54 L 90 59 L 85 59 L 85 64 L 80 64 Z M 110 54 L 110 64 L 105 64 L 105 59 L 100 59 L 100 54 Z M 110 84 L 100 84 L 100 79 L 105 79 L 105 74 L 110 74 Z M 80 84 L 80 74 L 85 74 L 85 79 L 90 79 L 90 84 Z" fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration" id="theme-deco-01" />
  <ns0:g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="80 48 1120 36">
    <ns0:text data-pptx-carrier="true" x="124" y="72" fill="#14191C" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.4">OSTRA  /  THE SYSTEM</ns0:text>
  </ns0:g>
  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="80 108 1120 110">
    <ns0:text data-pptx-carrier="true" x="80" y="166" fill="#14191C" font-size="44" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" letter-spacing="-1">One mark. Six moves.</ns0:text>
  </ns0:g>
  <ns0:g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="80 230 736 382">
    <ns0:text data-pptx-carrier="true" x="80" y="262" fill="#14191C" font-size="18" font-family="Arial, Helvetica, sans-serif">The mark is not repeated as decoration. It is decomposed into a<ns0:tspan x="80" dy="27.0">working vocabulary: complete, offset, parallel, cropped, outline</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">and matrix. One move leads each page; a second may appear only</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">if it is quiet.</ns0:tspan>
      <ns0:tspan x="80" dy="27.0"> </ns0:tspan>
      <ns0:tspan x="80" dy="27.0">Every move keeps the same thickness of 1u, the same stepped</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">inner contour and the same open centre. Scale changes; the</ns0:tspan>
      <ns0:tspan x="80" dy="27.0">proportions never do.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="note-1" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="848 230 352 220">
    <ns0:text data-pptx-carrier="true" x="848" y="262" fill="#667077" font-size="15" font-family="Arial, Helvetica, sans-serif">The arm is 2u long, the<ns0:tspan x="848" dy="22.5">frame 1u thick, the opening</ns0:tspan>
      <ns0:tspan x="848" dy="22.5">2u wide. Recognition comes</ns0:tspan>
      <ns0:tspan x="848" dy="22.5">from the interval, not from</ns0:tspan>
      <ns0:tspan x="848" dy="22.5">repetition.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="pull-quote" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="848 486 352 126">
    <ns0:text data-pptx-carrier="true" x="848" y="516" fill="#14228F" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">The mark sets proportion.<ns0:tspan x="848" dy="28.6">The page sets scale.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="source" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="80 644 900 32">
    <ns0:text data-pptx-carrier="true" x="80" y="668" fill="#667077" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.4">OSTRA IS A FICTIONAL IDENTITY</ns0:text>
  </ns0:g>
