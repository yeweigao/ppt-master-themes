    <ns0:text data-pptx-carrier="true" x="420" y="376" fill="#14191C" font-size="18" font-family="Arial, Helvetica, sans-serif">A platform above the water line, set back one arm's length<ns0:tspan x="420" dy="27.0">from the edge. The opening faces north, so the falls arrive</ns0:tspan>
