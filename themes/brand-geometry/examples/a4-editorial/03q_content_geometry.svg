  <ns0:g id="note" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="820 600 300 320">
    <ns0:text data-pptx-carrier="true" x="820" y="634" fill="#14191C" font-size="19" font-family="Arial, Helvetica, sans-serif">A platform above the water<ns0:tspan x="820" dy="28.5">line, set back one arm's</ns0:tspan>
      <ns0:tspan x="820" dy="28.5">length from the edge.</ns0:tspan>
      <ns0:tspan x="820" dy="28.5"> </ns0:tspan>
      <ns0:tspan x="820" dy="28.5">The opening faces north</ns0:tspan>
      <ns0:tspan x="820" dy="28.5">so the falls arrive in the</ns0:tspan>
      <ns0:tspan x="820" dy="28.5">frame before the sound does.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="100 1410 680 170">
    <ns0:text data-pptx-carrier="true" x="100" y="1444" fill="#14191C" font-size="22" font-family="Arial, Helvetica, sans-serif">Every project begins with the same frame, then adjusts<ns0:tspan x="100" dy="33.0">to light, ground and use. Here the frame is turned</ns0:tspan>
      <ns0:tspan x="100" dy="33.0">toward the water and left open at the top.</ns0:tspan>
    </ns0:text>
  </ns0:g>
