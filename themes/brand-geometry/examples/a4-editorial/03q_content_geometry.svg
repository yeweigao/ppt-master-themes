    <ns0:text data-pptx-carrier="true" x="100" y="270" fill="#14191C" font-size="72" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" letter-spacing="-1">A frame reveals<ns0:tspan x="100" dy="76.32">the falls.</ns0:tspan>
