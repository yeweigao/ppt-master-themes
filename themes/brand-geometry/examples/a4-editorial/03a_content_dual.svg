  <ns0:path d="M 100 96 L 114 96 L 114 103 L 107 103 L 107 110 L 100 110 Z M 142 96 L 142 110 L 135 110 L 135 103 L 128 103 L 128 96 Z M 142 138 L 128 138 L 128 131 L 135 131 L 135 124 L 142 124 Z M 100 138 L 100 124 L 107 124 L 107 131 L 114 131 L 114 138 Z" fill="#14228F" fill-opacity="1.0" data-pptx-role="decoration" id="theme-deco-01" />
  <ns0:g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="100 100 1040 44">
    <ns0:text data-pptx-carrier="true" x="160" y="124" fill="#14191C" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.6">OSTRA  /  POSITION</ns0:text>
  </ns0:g>
  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="100 210 1040 200">
    <ns0:text data-pptx-carrier="true" x="100" y="280" fill="#14191C" font-size="76" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" letter-spacing="-1">We design the<ns0:tspan x="100" dy="80.56">space between.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="lead" data-pptx-placeholder="subtitle" data-pptx-idx="3" data-pptx-bounds="100 435 1040 120">
    <ns0:text data-pptx-carrier="true" x="100" y="468" fill="#667077" font-size="28" font-family="Arial, Helvetica, sans-serif">A building begins with a line. A place begins<ns0:tspan x="100" dy="39.2">with the space that line leaves open.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="body-left" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="100 620 500 680">
    <ns0:text data-pptx-carrier="true" x="100" y="652" fill="#14191C" font-size="22" font-family="Arial, Helvetica, sans-serif">OSTRA works between structure and<ns0:tspan x="100" dy="34.1">ground: reading the site before</ns0:tspan>
      <ns0:tspan x="100" dy="34.1">drawing the frame, and drawing the</ns0:tspan>
      <ns0:tspan x="100" dy="34.1">frame before choosing a material.</ns0:tspan>
      <ns0:tspan x="100" dy="34.1"> </ns0:tspan>
      <ns0:tspan x="100" dy="34.1">One measure keeps many voices in</ns0:tspan>
      <ns0:tspan x="100" dy="34.1">the room. The width of a path, the</ns0:tspan>
      <ns0:tspan x="100" dy="34.1">depth of a threshold and the interval</ns0:tspan>
      <ns0:tspan x="100" dy="34.1">between trees are all set in the</ns0:tspan>
      <ns0:tspan x="100" dy="34.1">same unit, so decisions made by</ns0:tspan>
      <ns0:tspan x="100" dy="34.1">different people still agree.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="body-right" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="640 620 500 680">
    <ns0:text data-pptx-carrier="true" x="640" y="652" fill="#14191C" font-size="22" font-family="Arial, Helvetica, sans-serif">We are less interested in the object<ns0:tspan x="640" dy="34.1">than in what it frames. A good</ns0:tspan>
      <ns0:tspan x="640" dy="34.1">opening shows you something you</ns0:tspan>
      <ns0:tspan x="640" dy="34.1">had stopped looking at.</ns0:tspan>
      <ns0:tspan x="640" dy="34.1"> </ns0:tspan>
      <ns0:tspan x="640" dy="34.1">That is why the mark is never</ns0:tspan>
      <ns0:tspan x="640" dy="34.1">closed. Its centre is the work: a</ns0:tspan>
      <ns0:tspan x="640" dy="34.1">lake, a ridge, a clearing, a street</ns0:tspan>
      <ns0:tspan x="640" dy="34.1">corner. The four brackets only say</ns0:tspan>
      <ns0:tspan x="640" dy="34.1">where to stand.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="takeaway" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="100 1410 1040 160">
    <ns0:text data-pptx-carrier="true" x="100" y="1454" fill="#14191C" font-size="38" font-family="Georgia, 'Times New Roman', serif">A frame is not a border.<ns0:tspan x="100" dy="49.4">It is a decision about what to leave open.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="folio" data-pptx-placeholder="slide-number" data-pptx-idx="7" data-pptx-bounds="1040 1640 100 50">
    <ns0:text data-pptx-carrier="true" x="1140" y="1668" fill="#667077" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.6" text-anchor="end">04 / 08</ns0:text>
  </ns0:g>
</ns0:svg>