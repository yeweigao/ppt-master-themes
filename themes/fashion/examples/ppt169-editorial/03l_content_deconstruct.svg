  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="3" data-pptx-bounds="200 164 440 112">
    <ns0:text data-pptx-carrier="true" x="200" y="210" fill="#FFFFFF" font-size="34" font-family="'Bodoni Moda', Didot, 'Times New Roman', serif">A face is not<ns0:tspan x="200" dy="39.1">a mood board.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="904 40 272 300">
    <ns0:text data-pptx-carrier="true" x="904" y="72" fill="#E8E6F7" font-size="16" font-family="Archivo, Arial, sans-serif">Seventy faces were cast<ns0:tspan x="904" dy="23.2">in four cities. None was</ns0:tspan>
      <ns0:tspan x="904" dy="23.2">chosen to match a</ns0:tspan>
      <ns0:tspan x="904" dy="23.2">reference: each because</ns0:tspan>
      <ns0:tspan x="904" dy="23.2">the clothes looked</ns0:tspan>
      <ns0:tspan x="904" dy="23.2">different on them.</ns0:tspan>
      <ns0:tspan x="904" dy="23.2"> </ns0:tspan>
      <ns0:tspan x="904" dy="23.2">The grid crops; it does</ns0:tspan>
      <ns0:tspan x="904" dy="23.2">not hide the eyes.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="source" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="584 584 520 80">
    <ns0:text data-pptx-carrier="true" x="584" y="622" fill="#FFFFFF" font-size="26" font-family="'Bodoni Moda', Didot, 'Times New Roman', serif" font-style="italic">“We cast people, then let<ns0:tspan x="584" dy="31.2">the clothes catch up.”</ns0:tspan>
