<text x="944" y="292" font-family="Bodoni Moda" font-size="88" fill="#FFFFFF" font-weight="bold" letter-spacing="-2">170</text>
<text x="944" y="334" font-family="Six Caps" font-size="30" fill="#FFFFFF" letter-spacing="3.6">PEOPLE</text>
<line x1="944" y1="356" x2="1128" y2="356" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>
<line x1="944" y1="826" x2="1128" y2="826" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.45"/>
<text x="944" y="866" font-family="Six Caps" font-size="38" fill="#FFFFFF" letter-spacing="4.2">PORTRAITS</text>
<text x="944" y="884" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="1.6">MASK / 01 — SERIES 170</text>
<text x="88" y="1008" font-family="Archivo" font-size="15" fill="#77736B" font-weight="bold" letter-spacing="2.8">THE PORTRAIT</text>
<text x="1152" y="1008" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="2.4" text-anchor="end">LONDON / 2026</text>
<line x1="88" y1="1028" x2="1152" y2="1028" stroke="#D9D5CB" stroke-width="1"/>
<text x="88" y="1120" font-family="Bodoni Moda" font-size="64" fill="#0A0A0A" font-weight="bold" letter-spacing="-1.0">The face becomes</text>
<text x="88" y="1192" font-family="Bodoni Moda" font-size="64" fill="#1710CC" font-weight="bold" letter-spacing="-1.0">the typeface.</text>
<text x="88" y="1258" font-family="Archivo" font-size="17" fill="#0A0A0A" letter-spacing="0.2">One hundred and seventy people, photographed</text>
<text x="88" y="1286" font-family="Archivo" font-size="17" fill="#0A0A0A" letter-spacing="0.2">across four cities. Ten silhouettes, worn without</text>
<text x="88" y="1314" font-family="Archivo" font-size="17" fill="#0A0A0A" letter-spacing="0.2">ceremony. The portrait holds what the archive</text>
<text x="88" y="1342" font-family="Archivo" font-size="17" fill="#0A0A0A" letter-spacing="0.2">cannot. Type is the last edit.</text>
<text x="664" y="1258" font-family="Bodoni Moda" font-size="24" fill="#0A0A0A">Light decides the silhouette.</text>
<text x="664" y="1290" font-family="Bodoni Moda" font-size="24" fill="#0A0A0A">The page only decides where</text>
<text x="664" y="1322" font-family="Bodoni Moda" font-size="24" fill="#0A0A0A">to cut it.</text>
<text x="664" y="1368" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">A portrait is not a likeness.</text>
<text x="664" y="1386" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">It is a decision about light.</text>
<line x1="88" y1="1450" x2="1152" y2="1450" stroke="#D9D5CB" stroke-width="1"/>
<rect x="88" y="1490" width="72" height="6" fill="#1710CC" fill-opacity="0.86"/>
<text x="88" y="1530" font-family="Archivo" font-size="14" fill="#77736B" font-weight="bold" letter-spacing="1.8">TYPE MASK FROM A FREE PORTRAIT</text>
<text x="88" y="1548" font-family="Archivo" font-size="14" fill="#77736B" letter-spacing="1.6">SIX CAPS × BODONI MODA / SERIES 170</text>
<text x="1152" y="1530" font-family="Archivo" font-size="14" fill="#77736B" font-weight="bold" letter-spacing="1.8" text-anchor="end">IMAGE AS LETTERFORM</text>
<text x="1152" y="1548" font-family="Archivo" font-size="14" fill="#77736B" letter-spacing="1.6" text-anchor="end">PAPER / COBALT / INK</text>
