<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" width="1240" height="1754" lang="en-GB" font-family="Archivo" data-pptx-page-role="content">
<rect id="bg-fill" data-pptx-role="background" x="0" y="0" width="1240" height="1754" fill="#1710CC"/>
<g id="masthead" data-pptx-role="decoration" data-pptx-bounds="88 40 1064 56"><line x1="88" y1="92" x2="1152" y2="92" stroke="#FFFFFF" stroke-width="1"/><text x="88" y="70" font-family="Archivo" font-size="16" fill="#FFFFFF" font-weight="bold" letter-spacing="2.8">MAISON 170</text><text x="1152" y="70" font-family="Archivo" font-size="15" fill="#FFFFFF" font-weight="bold" letter-spacing="2.4" text-anchor="end">THE METHOD</text><text x="1152" y="84" font-family="Archivo" font-size="14" fill="#FFFFFF" letter-spacing="2.0" text-anchor="end">04 / 11</text></g>
<text x="88" y="292" font-family="Bodoni Moda" font-size="86" fill="#FFFFFF" font-weight="bold" letter-spacing="-1.6">FOUR MOVES</text>
<text x="1152" y="232" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="2.2" text-anchor="end">EVERY PAGE IS BUILT</text>
<text x="1152" y="252" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="2.2" text-anchor="end">IN FOUR MOVES</text>
<line x1="88" y1="330" x2="1152" y2="330" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.55"/>
<g data-pptx-bounds="0 0 1240 1754" id="method-01" data-pptx-role="decoration">
<rect id="m1" data-pptx-role="decoration" x="88" y="386" width="248" height="880" fill="#FFFFFF" fill-opacity="1.0"/>
<rect x="88" y="386" width="248" height="10" fill="#1710CC" fill-opacity="1.0"/>
</g>
<text x="112" y="620" font-family="Bodoni Moda" font-size="150" fill="#1710CC" font-weight="bold" letter-spacing="-6">01</text>
<text x="112" y="690" font-family="Six Caps" font-size="40" fill="#0A0A0A" letter-spacing="4.2">FRAME</text>
<line x1="112" y1="710" x2="312" y2="710" stroke="#D9D5CB" stroke-width="1"/>
<text x="112" y="746" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">A frame is a decision</text>
<text x="112" y="764" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">about what the page</text>
<text x="112" y="782" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">refuses to show.</text>
<image id="m1-img" data-pptx-role="decoration" href="../images/_mask.jpg" x="112" y="1030" width="200" height="200" preserveAspectRatio="xMidYMid slice"/>
<text x="112" y="1252" font-family="Archivo" font-size="14" fill="#77736B" font-weight="bold" letter-spacing="1.6">CROP / SILENCE</text>
<g data-pptx-bounds="0 0 1240 1754" id="method-02" data-pptx-role="decoration">
<rect id="m2" data-pptx-role="decoration" x="360" y="386" width="248" height="880" fill="#FFFFFF" fill-opacity="1.0"/>
<rect x="360" y="386" width="248" height="10" fill="#1710CC" fill-opacity="1.0"/>
</g>
<text x="384" y="620" font-family="Bodoni Moda" font-size="150" fill="#1710CC" font-weight="bold" letter-spacing="-6">02</text>
<text x="384" y="690" font-family="Six Caps" font-size="40" fill="#0A0A0A" letter-spacing="4.2">MASK</text>
<line x1="384" y1="710" x2="584" y2="710" stroke="#D9D5CB" stroke-width="1"/>
<text x="384" y="746" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">The letterform holds</text>
<text x="384" y="764" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">the photograph. The</text>
<text x="384" y="782" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">word becomes a window.</text>
<image id="m2-img" data-pptx-role="decoration" href="../images/type_portraits.png" x="384" y="1096" width="200" height="94" preserveAspectRatio="xMidYMid slice"/>
<text x="384" y="1252" font-family="Archivo" font-size="14" fill="#77736B" font-weight="bold" letter-spacing="1.6">TYPE / IMAGE</text>
<g data-pptx-bounds="0 0 1240 1754" id="method-03" data-pptx-role="decoration">
<rect id="m3" data-pptx-role="decoration" x="632" y="386" width="248" height="880" fill="#FFFFFF" fill-opacity="1.0"/>
<rect x="632" y="386" width="248" height="10" fill="#1710CC" fill-opacity="1.0"/>
</g>
<text x="656" y="620" font-family="Bodoni Moda" font-size="150" fill="#1710CC" font-weight="bold" letter-spacing="-6">03</text>
<text x="656" y="690" font-family="Six Caps" font-size="40" fill="#0A0A0A" letter-spacing="4.2">OVERPRINT</text>
<line x1="656" y1="710" x2="856" y2="710" stroke="#D9D5CB" stroke-width="1"/>
<text x="656" y="746" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">Colour does not cover</text>
<text x="656" y="764" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">the image. It negotiates</text>
<text x="656" y="782" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">with it.</text>
<g data-pptx-bounds="0 0 1240 1754" id="m3-image" data-pptx-role="decoration">
<image id="m3-img" data-pptx-role="decoration" href="../images/_profile.jpg" x="656" y="1030" width="200" height="200" preserveAspectRatio="xMidYMid slice"/>
<rect x="656" y="1030" width="200" height="200" fill="#1710CC" fill-opacity="0.55"/>
</g>
<text x="656" y="1252" font-family="Archivo" font-size="14" fill="#77736B" font-weight="bold" letter-spacing="1.6">ALPHA / 55</text>
<g data-pptx-bounds="0 0 1240 1754" id="method-04" data-pptx-role="decoration">
<rect id="m4" data-pptx-role="decoration" x="904" y="386" width="248" height="880" fill="#FFFFFF" fill-opacity="1.0"/>
<rect x="904" y="386" width="248" height="10" fill="#1710CC" fill-opacity="1.0"/>
</g>
<text x="928" y="620" font-family="Bodoni Moda" font-size="150" fill="#1710CC" font-weight="bold" letter-spacing="-6">04</text>
<text x="928" y="690" font-family="Six Caps" font-size="40" fill="#0A0A0A" letter-spacing="4.2">INTERRUPT</text>
<line x1="928" y1="710" x2="1128" y2="710" stroke="#D9D5CB" stroke-width="1"/>
<text x="928" y="746" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">One element breaks the</text>
<text x="928" y="764" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">grid so the rest can</text>
<text x="928" y="782" font-family="Archivo" font-size="15" fill="#77736B" letter-spacing="0.2">finally be read.</text>
<g data-pptx-bounds="0 0 1240 1754" id="m4-image" data-pptx-role="decoration">
<image id="m4-img" data-pptx-role="decoration" href="../images/_street.jpg" x="928" y="1030" width="200" height="200" preserveAspectRatio="xMidYMid slice"/>
<rect x="928" y="1030" width="200" height="200" fill="#0A0A0A" fill-opacity="0.3"/>
</g>
<text x="928" y="1252" font-family="Archivo" font-size="14" fill="#77736B" font-weight="bold" letter-spacing="1.6">GRID / BREAK</text>
<text x="88" y="1380" font-family="Bodoni Moda" font-size="28" fill="#FFFFFF">A page is an argument built in four moves.</text>
<text x="88" y="1414" font-family="Archivo" font-size="15" fill="#FFFFFF" letter-spacing="0.2" fill-opacity="0.8">Frame, mask, overprint, interrupt — then edit until only the necessary remains.</text>
<line x1="88" y1="1450" x2="1152" y2="1450" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.5"/>
<text x="88" y="1500" font-family="Six Caps" font-size="44" fill="#FFFFFF" letter-spacing="5.0" fill-opacity="0.9">FRAME</text>
<text x="360" y="1500" font-family="Six Caps" font-size="44" fill="#FFFFFF" letter-spacing="5.0" fill-opacity="0.9">MASK</text>
<text x="632" y="1500" font-family="Six Caps" font-size="44" fill="#FFFFFF" letter-spacing="5.0" fill-opacity="0.9">OVERPRINT</text>
<text x="904" y="1500" font-family="Six Caps" font-size="44" fill="#FFFFFF" letter-spacing="5.0" fill-opacity="0.9">INTERRUPT</text>
<text x="88" y="1530" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="1.8" fill-opacity="0.7">01</text>
<text x="360" y="1530" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="1.8" fill-opacity="0.7">02</text>
<text x="632" y="1530" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="1.8" fill-opacity="0.7">03</text>
<text x="904" y="1530" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="1.8" fill-opacity="0.7">04</text>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="88 1640 1064 50"><line x1="88" y1="1652" x2="1152" y2="1652" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.35"/><text x="88" y="1682" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="2.6">FASHION 170 — A GLOBAL CAST</text><text x="1152" y="1682" font-family="Archivo" font-size="14" fill="#FFFFFF" font-weight="bold" letter-spacing="2.4" text-anchor="end">04</text></g>
</svg>
