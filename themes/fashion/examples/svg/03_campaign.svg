<text x="808" y="488" font-family="Bodoni Moda" font-size="52" fill="#1710CC" letter-spacing="-0.6">campaign.</text>
<text x="808" y="566" font-family="Archivo" font-size="14" fill="#0A0A0A" letter-spacing="0.2">The letterform is the frame. The</text>
<text x="808" y="590" font-family="Archivo" font-size="14" fill="#0A0A0A" letter-spacing="0.2">photograph is the ink. A single</text>
<text x="808" y="614" font-family="Archivo" font-size="14" fill="#0A0A0A" letter-spacing="0.2">word can hold an entire season.</text>
