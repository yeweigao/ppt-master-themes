<text x="808" y="890" font-family="Bodoni Moda" font-size="22" fill="#0A0A0A">A word is a container.</text>
<text x="808" y="922" font-family="Bodoni Moda" font-size="22" fill="#0A0A0A">The page decides its weight.</text>
<text x="808" y="990" font-family="Archivo" font-size="14" fill="#77736B" font-weight="bold" letter-spacing="1.6">MASK GENERATED FROM A FREE PORTRAIT</text>
