<text x="128" y="330" font-family="Archivo" font-size="15" fill="#1710CC" font-weight="bold" letter-spacing="2.8">CHAPTER 01 / LONDON</text>
<text x="120" y="540" font-family="Bodoni Moda" font-size="204" fill="#0A0A0A" font-weight="bold" letter-spacing="-8">#01</text>
<text x="128" y="610" font-family="Six Caps" font-size="54" fill="#0A0A0A" letter-spacing="3.0">PORTRAIT OF</text>
<text x="128" y="662" font-family="Six Caps" font-size="54" fill="#0A0A0A" letter-spacing="3.0">A HOUSE</text>
<text x="128" y="716" font-family="Archivo" font-size="17" fill="#0A0A0A" letter-spacing="0.2">An archive is not a collection of objects.</text>
<text x="128" y="742" font-family="Archivo" font-size="17" fill="#0A0A0A" letter-spacing="0.2">It is a way of looking — at a coat, at a</text>
<text x="128" y="768" font-family="Archivo" font-size="17" fill="#0A0A0A" letter-spacing="0.2">posture, at the person who wears them.</text>
