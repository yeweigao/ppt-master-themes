<text x="128" y="1010" font-family="Bodoni Moda" font-size="24" fill="#0A0A0A">The camera does not invent presence.</text>
<text x="128" y="1042" font-family="Bodoni Moda" font-size="24" fill="#0A0A0A">It waits for it, then edits.</text>
<text x="128" y="1200" font-family="Archivo" font-size="15" fill="#0A0A0A" font-weight="bold" letter-spacing="2.6">MAISON 170</text>
<text x="128" y="1218" font-family="Archivo" font-size="14" fill="#77736B" letter-spacing="2.0">A GLOBAL CAST / VOLUME ONE</text>
