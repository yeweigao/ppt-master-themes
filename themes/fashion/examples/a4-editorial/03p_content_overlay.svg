    <ns0:text data-pptx-carrier="true" x="180" y="740" fill="#0A0A0A" font-size="78" font-family="'Bodoni Moda', Didot, 'Times New Roman', serif" letter-spacing="-1">The city styles it<ns0:tspan x="180" dy="84.24">faster than we do.</ns0:tspan>
