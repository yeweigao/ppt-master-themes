  <ns0:g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="180 945 880 265">
    <ns0:text data-pptx-carrier="true" x="180" y="990" fill="#0A0A0A" font-size="24" font-family="Archivo, Arial, sans-serif">We stopped building sets. A car park at dawn, a court<ns0:tspan x="180" dy="37.2">with no net, a coat borrowed from the person wearing it:</ns0:tspan>
      <ns0:tspan x="180" dy="37.2">the street supplies the context and the cast supplies</ns0:tspan>
      <ns0:tspan x="180" dy="37.2">the attitude. Our job is to keep both in frame.</ns0:tspan>
    </ns0:text>
  </ns0:g>
