  </ns0:g>
  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="4" data-pptx-bounds="220 255 460 200">
    <ns0:text data-pptx-carrier="true" x="220" y="320" fill="#FFFFFF" font-size="46" font-family="'Bodoni Moda', Didot, 'Times New Roman', serif">A face is not<ns0:tspan x="220" dy="52.9">a mood board.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="main-copy" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="820 530 360 400">
    <ns0:text data-pptx-carrier="true" x="820" y="566" fill="#E8E6F7" font-size="21" font-family="Archivo, Arial, sans-serif">Seventy faces were cast in<ns0:tspan x="820" dy="31.5">four cities. None was chosen</ns0:tspan>
      <ns0:tspan x="820" dy="31.5">to match a reference. Each</ns0:tspan>
      <ns0:tspan x="820" dy="31.5">was chosen because the</ns0:tspan>
      <ns0:tspan x="820" dy="31.5">clothes looked different on</ns0:tspan>
      <ns0:tspan x="820" dy="31.5">them than on anyone else.</ns0:tspan>
      <ns0:tspan x="820" dy="31.5"> </ns0:tspan>
      <ns0:tspan x="820" dy="31.5">The grid crops; it does not</ns0:tspan>
      <ns0:tspan x="820" dy="31.5">hide. The eyes stay clear.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="source" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="600 1420 540 160">
    <ns0:text data-pptx-carrier="true" x="600" y="1466" fill="#FFFFFF" font-size="34" font-family="'Bodoni Moda', Didot, 'Times New Roman', serif" font-style="italic">“We cast people,<ns0:tspan x="600" dy="42.5">then let the clothes</ns0:tspan>
      <ns0:tspan x="600" dy="42.5">catch up.”</ns0:tspan>
    </ns0:text>
