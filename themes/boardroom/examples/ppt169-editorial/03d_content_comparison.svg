  <ns0:g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="80 48 1120 36">
    <ns0:text data-pptx-carrier="true" x="100" y="72" fill="#12232F" font-size="14" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2">THE CHOICE  /  OPERATING MODEL</ns0:text>
  </ns0:g>
  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="80 104 1120 104">
    <ns0:text data-pptx-carrier="true" x="80" y="158" fill="#071C2C" font-size="40" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Federate the decisions. Keep one owner.</ns0:text>
  </ns0:g>
  <ns0:g id="label-left" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="80 230 544 50">
    <ns0:text data-pptx-carrier="true" x="80" y="266" fill="#12232F" font-size="26" font-family="Georgia, 'Times New Roman', serif">Today: central</ns0:text>
  </ns0:g>
  <ns0:g id="label-right" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="656 230 544 50">
    <ns0:text data-pptx-carrier="true" x="656" y="266" fill="#00A9F4" font-size="26" font-family="Georgia, 'Times New Roman', serif">Proposed: federated</ns0:text>
  </ns0:g>
  <ns0:g id="left-1" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="80 304 544 90">
    <ns0:text data-pptx-carrier="true" x="80" y="330" fill="#12232F" font-size="18" font-family="Georgia, 'Times New Roman', serif">Six weeks from proposal to decision;<ns0:tspan x="80" dy="26.1">every launch queues at one desk.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="right-1" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="656 304 544 90">
    <ns0:text data-pptx-carrier="true" x="656" y="330" fill="#12232F" font-size="18" font-family="Georgia, 'Times New Roman', serif">Two weeks. Business lines decide<ns0:tspan x="656" dy="26.1">inside guardrails set once a year.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="left-2" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="80 420 544 90">
    <ns0:text data-pptx-carrier="true" x="80" y="446" fill="#12232F" font-size="18" font-family="Georgia, 'Times New Roman', serif">Low on paper; the delay cost<ns0:tspan x="80" dy="26.1">appears in no budget line.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="right-2" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="656 420 544 90">
    <ns0:text data-pptx-carrier="true" x="656" y="446" fill="#12232F" font-size="18" font-family="Georgia, 'Times New Roman', serif">Medium. A shared platform funded<ns0:tspan x="656" dy="26.1">by two portfolio exits.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="left-3" data-pptx-placeholder="body" data-pptx-idx="9" data-pptx-bounds="80 532 544 90">
    <ns0:text data-pptx-carrier="true" x="80" y="558" fill="#12232F" font-size="18" font-family="Georgia, 'Times New Roman', serif">Drift. No owner can say which<ns0:tspan x="80" dy="26.1">gate a launch is waiting at.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="right-3" data-pptx-placeholder="body" data-pptx-idx="10" data-pptx-bounds="656 532 544 90">
    <ns0:text data-pptx-carrier="true" x="656" y="558" fill="#12232F" font-size="18" font-family="Georgia, 'Times New Roman', serif">Contained. One owner per launch,<ns0:tspan x="656" dy="26.1">one cadence for all.</ns0:tspan>
    </ns0:text>
  </ns0:g>
