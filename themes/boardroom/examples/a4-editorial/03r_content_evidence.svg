    <ns0:text data-pptx-carrier="true" x="100" y="280" fill="#071C2C" font-size="64" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Orders are up 7.4%.<ns0:tspan x="100" dy="71.68">Revenue is up 2.1%.</ns0:tspan>
