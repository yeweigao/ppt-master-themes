    <ns0:text data-pptx-carrier="true" x="100" y="500" fill="#12232F" font-size="28" font-family="Georgia, 'Times New Roman', serif">The difference is not a demand problem. It is<ns0:tspan x="100" dy="39.2">the cumulative cost of six planning cycles.</ns0:tspan>
