    <ns0:text data-pptx-carrier="true" x="820" y="728" fill="#12232F" font-size="22" font-family="Georgia, 'Times New Roman', serif">What changed<ns0:tspan x="820" dy="31.9"> </ns0:tspan>
      <ns0:tspan x="820" dy="31.9">The order book has</ns0:tspan>
      <ns0:tspan x="820" dy="31.9">grown faster than the</ns0:tspan>
      <ns0:tspan x="820" dy="31.9">organisation's ability</ns0:tspan>
