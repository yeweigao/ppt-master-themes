  <ns0:g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="100 100 460 60">
    <ns0:text data-pptx-carrier="true" x="100" y="130" fill="#FFFFFF" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.2">THE TEST  /  FOUR NUMBERS</ns0:text>
  </ns0:g>
  <ns0:g id="lead" data-pptx-placeholder="subtitle" data-pptx-idx="2" data-pptx-bounds="100 185 460 220">
    <ns0:text data-pptx-carrier="true" x="100" y="226" fill="#C8D5DE" font-size="28" font-family="Georgia, 'Times New Roman', serif">Four numbers the board<ns0:tspan x="100" dy="39.2">will watch, each with a</ns0:tspan>
      <ns0:tspan x="100" dy="39.2">baseline, a target and</ns0:tspan>
      <ns0:tspan x="100" dy="39.2">one owner.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="step-1" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="120 1110 190 120">
    <ns0:text data-pptx-carrier="true" x="120" y="1140" fill="#071C2C" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="1.2">MARGIN<ns0:tspan x="120" dy="24.8">18.6% → 22.8%</ns0:tspan>
      <ns0:tspan x="120" dy="24.8">OWNER: CFO</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="step-2" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="390 670 190 120">
    <ns0:text data-pptx-carrier="true" x="390" y="700" fill="#071C2C" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="1.2">LAUNCH CYCLE<ns0:tspan x="390" dy="24.8">23 → 9 DAYS</ns0:tspan>
      <ns0:tspan x="390" dy="24.8">OWNER: COO</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="body-left" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="370 1365 230 280">
    <ns0:text data-pptx-carrier="true" x="370" y="1398" fill="#FFFFFF" font-size="20" font-family="Georgia, 'Times New Roman', serif">Read left to right:<ns0:tspan x="370" dy="29.0">margin moves first,</ns0:tspan>
      <ns0:tspan x="370" dy="29.0">delivery follows</ns0:tspan>
      <ns0:tspan x="370" dy="29.0">once gates are cut.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="step-3" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="660 1210 190 120">
    <ns0:text data-pptx-carrier="true" x="660" y="1240" fill="#071C2C" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="1.2">DECISION GATES<ns0:tspan x="660" dy="24.8">14 → 4</ns0:tspan>
      <ns0:tspan x="660" dy="24.8">OWNER: COO</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="step-4" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="930 250 190 120">
    <ns0:text data-pptx-carrier="true" x="930" y="280" fill="#071C2C" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="1.2">ON-TIME DELIVERY<ns0:tspan x="930" dy="24.8">78% → 94%</ns0:tspan>
      <ns0:tspan x="930" dy="24.8">OWNER: BU LEADS</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="body-right" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="910 1000 230 560">
    <ns0:text data-pptx-carrier="true" x="910" y="1036" fill="#C8D5DE" font-size="20" font-family="Georgia, 'Times New Roman', serif">A number without<ns0:tspan x="910" dy="29.0">an owner is a wish.</ns0:tspan>
      <ns0:tspan x="910" dy="29.0"> </ns0:tspan>
      <ns0:tspan x="910" dy="29.0">Review cadence: one</ns0:tspan>
      <ns0:tspan x="910" dy="29.0">page, one owner,</ns0:tspan>
      <ns0:tspan x="910" dy="29.0">monthly. No</ns0:tspan>
      <ns0:tspan x="910" dy="29.0">re-baselining</ns0:tspan>
      <ns0:tspan x="910" dy="29.0">between gates; two</ns0:tspan>
      <ns0:tspan x="910" dy="29.0">consecutive misses</ns0:tspan>
      <ns0:tspan x="910" dy="29.0">trigger a board</ns0:tspan>
      <ns0:tspan x="910" dy="29.0">memo.</ns0:tspan>
    </ns0:text>
  </ns0:g>
