  <ns0:g id="title" data-pptx-placeholder="title" data-pptx-idx="2" data-pptx-bounds="100 210 1040 220">
    <ns0:text data-pptx-carrier="true" x="100" y="280" fill="#071C2C" font-size="64" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">Federate the decisions.<ns0:tspan x="100" dy="71.68">Keep one owner.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="label-left" data-pptx-placeholder="body" data-pptx-idx="3" data-pptx-bounds="100 525 500 100">
    <ns0:text data-pptx-carrier="true" x="100" y="590" fill="#12232F" font-size="38" font-family="Georgia, 'Times New Roman', serif">Today: central</ns0:text>
  </ns0:g>
  <ns0:g id="label-right" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="640 525 500 100">
    <ns0:text data-pptx-carrier="true" x="640" y="590" fill="#00A9F4" font-size="38" font-family="Georgia, 'Times New Roman', serif">Proposed: federated</ns0:text>
  </ns0:g>
  <ns0:g id="left-1" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="100 700 500 190">
    <ns0:text data-pptx-carrier="true" x="100" y="744" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Six weeks from proposal<ns0:tspan x="100" dy="34.8">to decision; every launch</ns0:tspan>
      <ns0:tspan x="100" dy="34.8">queues at the same desk.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="right-1" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="640 700 500 190">
    <ns0:text data-pptx-carrier="true" x="640" y="744" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Two weeks. Business lines<ns0:tspan x="640" dy="34.8">decide inside guardrails</ns0:tspan>
      <ns0:tspan x="640" dy="34.8">the board sets once a year.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="left-2" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="100 990 500 170">
    <ns0:text data-pptx-carrier="true" x="100" y="1030" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Low on paper; the delay<ns0:tspan x="100" dy="34.8">cost does not appear in</ns0:tspan>
      <ns0:tspan x="100" dy="34.8">any budget line.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="right-2" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="640 990 500 170">
    <ns0:text data-pptx-carrier="true" x="640" y="1030" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Medium. A shared platform<ns0:tspan x="640" dy="34.8">funded by two portfolio</ns0:tspan>
      <ns0:tspan x="640" dy="34.8">exits, not by headcount.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="left-3" data-pptx-placeholder="body" data-pptx-idx="9" data-pptx-bounds="100 1260 500 170">
    <ns0:text data-pptx-carrier="true" x="100" y="1300" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Drift. No owner can say<ns0:tspan x="100" dy="34.8">which gate a launch</ns0:tspan>
      <ns0:tspan x="100" dy="34.8">is waiting at.</ns0:tspan>
    </ns0:text>
  </ns0:g>
  <ns0:g id="right-3" data-pptx-placeholder="body" data-pptx-idx="10" data-pptx-bounds="640 1260 500 170">
    <ns0:text data-pptx-carrier="true" x="640" y="1300" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Contained. One accountable<ns0:tspan x="640" dy="34.8">owner per launch, one</ns0:tspan>
      <ns0:tspan x="640" dy="34.8">cadence for all.</ns0:tspan>
    </ns0:text>
