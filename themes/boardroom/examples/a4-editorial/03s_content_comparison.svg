  <ns0:g id="kicker" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="100 100 1040 44">
    <ns0:text data-pptx-carrier="true" x="122" y="124" fill="#12232F" font-size="15" font-family="Arial, Helvetica, sans-serif" font-weight="bold" letter-spacing="2.2">THE CHOICE  /  OPERATING MODEL</ns0:text>
