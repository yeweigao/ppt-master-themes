  <ns0:g id="event-1" data-pptx-placeholder="body" data-pptx-idx="4" data-pptx-bounds="460 530 680 240">
    <ns0:text data-pptx-carrier="true" x="460" y="570" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Simplify the portfolio<ns0:tspan x="460" dy="36.0">Cut two product lines and publish kill criteria</ns0:tspan>
