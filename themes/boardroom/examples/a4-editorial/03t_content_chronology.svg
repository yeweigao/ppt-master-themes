    <ns0:text data-pptx-carrier="true" x="460" y="1290" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Reset the operating rhythm<ns0:tspan x="460" dy="36.0">Quarterly gates, monthly review, weekly delivery</ns0:tspan>
      <ns0:tspan x="460" dy="36.0">cell with the same metrics. Owner: COO / CHRO.</ns0:tspan>
