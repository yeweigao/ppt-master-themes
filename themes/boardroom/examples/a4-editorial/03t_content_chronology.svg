  <ns0:g id="event-2" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="460 890 680 240">
    <ns0:text data-pptx-carrier="true" x="460" y="930" fill="#12232F" font-size="24" font-family="Georgia, 'Times New Roman', serif">Rebuild decision rights<ns0:tspan x="460" dy="36.0">One launch owner, two decision gates and three</ns0:tspan>
