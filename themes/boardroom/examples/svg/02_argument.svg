<g id="br-argument-p4" data-pptx-placeholder="title" data-pptx-idx="4" data-pptx-bounds="90 168 1060 159.92"><text x="90" y="217.28" fill="#12232F" font-size="56" font-family="Georgia" font-weight="bold" data-pptx-carrier="true">Growth is no longer the constraint.<tspan x="90" dy="64.96">Execution is.</tspan></text></g>
<g id="br-argument-p5" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="90 364 1020 92"><text x="90" y="387.76" fill="#5F6E79" font-size="27" font-family="Georgia" data-pptx-carrier="true">Order intake is healthy. The gap between demand and revenue now sits<tspan x="90" dy="38">inside the operating model — in the way we choose, staff and ship work.</tspan></text></g>
