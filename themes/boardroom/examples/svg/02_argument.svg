<g id="br-argument-p8" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="90 744 330 220"><text x="90" y="761.6" fill="#5F6E79" font-size="20" font-family="Georgia" data-pptx-carrier="true">Order intake grew 7.4% while<tspan x="90" dy="29">revenue grew 2.1%. The gap is</tspan><tspan x="90" dy="29">delivery, not appetite.</tspan></text></g>
