<g id="br-briefing-p27" data-pptx-placeholder="body" data-pptx-idx="27" data-pptx-bounds="840 954 300 84"><text x="840" y="969.84" fill="#5F6E79" font-size="18" font-family="Georgia" data-pptx-carrier="true">of planning that re-open<tspan x="840" dy="25">decisions already taken</tspan></text></g>
<line id="br-briefing-d24" data-pptx-role="decoration" x1="840" y1="1042" x2="1150" y2="1042" stroke="#D5DCE1" stroke-width="1"/>
<g id="br-briefing-p28" data-pptx-placeholder="body" data-pptx-idx="28" data-pptx-bounds="90 1094 340 42.8"><text x="90" y="1120" fill="#E3120B" font-size="16" font-weight="bold" letter-spacing="2.0" data-pptx-carrier="true">WHAT CHANGED</text></g>
<g id="br-briefing-p29" data-pptx-placeholder="body" data-pptx-idx="29" data-pptx-bounds="90 1132 335 380"><text x="90" y="1149.6" fill="#12232F" font-size="20" font-family="Georgia" data-pptx-carrier="true">The order book has grown faster<tspan x="90" dy="30">than the organisation's ability</tspan><tspan x="90" dy="30">to convert it. Revenue follows</tspan><tspan x="90" dy="30">intake with a two-year lag, and</tspan><tspan x="90" dy="30">the lag is widening, not</tspan><tspan x="90" dy="30">closing.</tspan></text></g>
<g id="br-briefing-p30" data-pptx-placeholder="body" data-pptx-idx="30" data-pptx-bounds="445 1132 335 380"><text x="445" y="1149.6" fill="#12232F" font-size="20" font-family="Georgia" data-pptx-carrier="true">Price is not the constraint.<tspan x="445" dy="30">Win rates and average selling</tspan><tspan x="445" dy="30">prices are stable. What has</tspan><tspan x="445" dy="30">changed is the volume of</tspan><tspan x="445" dy="30">exceptions each launch now</tspan><tspan x="445" dy="30">carries through the same fixed</tspan><tspan x="445" dy="30">gate sequence.</tspan></text></g>
<rect id="br-briefing-d25" data-pptx-role="decoration" x="810" y="1094" width="340" height="412" fill="#071C2C"/>
<g id="br-briefing-p31" data-pptx-placeholder="body" data-pptx-idx="31" data-pptx-bounds="840 1126 280 40.25"><text x="840" y="1150" fill="#00A9F4" font-size="15" font-weight="bold" letter-spacing="2.0" data-pptx-carrier="true">PULL QUOTE</text></g>
<g id="br-briefing-p32" data-pptx-placeholder="body" data-pptx-idx="32" data-pptx-bounds="840 1170 280 240"><text x="840" y="1196.4" fill="#FFFFFF" font-size="30" font-family="Georgia" font-style="italic" data-pptx-carrier="true">We are not short<tspan x="840" dy="42">of demand. We are</tspan><tspan x="840" dy="42">short of</tspan><tspan x="840" dy="42">throughput.</tspan></text></g>
<g id="br-briefing-p33" data-pptx-placeholder="body" data-pptx-idx="33" data-pptx-bounds="840 1432 280 39.7"><text x="840" y="1456" fill="#9FB1BE" font-size="14" font-weight="bold" letter-spacing="1.4" data-pptx-carrier="true">COO / OPERATING REVIEW</text></g>
