<g id="br-briefing-p4" data-pptx-placeholder="title" data-pptx-idx="4" data-pptx-bounds="90 168 1060 159.92"><text x="90" y="217.28" fill="#12232F" font-size="56" font-family="Georgia" font-weight="bold" data-pptx-carrier="true">Orders are up 7.4%.<tspan x="90" dy="64.96">Revenue is up 2.1%.</tspan></text></g>
<g id="br-briefing-p5" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="90 354 1020 92"><text x="90" y="377.76" fill="#5F6E79" font-size="27" font-family="Georgia" data-pptx-carrier="true">The difference is not a demand problem. It is the cumulative cost of<tspan x="90" dy="38">six planning cycles, fourteen gates and no single owner.</tspan></text></g>
