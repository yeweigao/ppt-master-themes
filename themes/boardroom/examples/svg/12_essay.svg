<g id="br-essay-p1" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="110 92 196 42.8"><text x="110" y="118" fill="#FFFFFF" font-size="16" font-weight="bold" letter-spacing="2.4" data-pptx-carrier="true">THE LEADER</text></g>
<g id="br-essay-p2" data-pptx-placeholder="slide-number" data-pptx-idx="2" data-pptx-bounds="910 88 240 43.7"><text x="1150" y="116" fill="#5F6E79" font-size="14" font-weight="bold" letter-spacing="1.6" text-anchor="end" data-pptx-carrier="true">12 / THE LEADER</text></g>
<line id="br-essay-d3" data-pptx-role="decoration" x1="90" y1="148" x2="1150" y2="148" stroke="#071C2C" stroke-width="2"/>
<g id="br-essay-p3" data-pptx-placeholder="title" data-pptx-idx="3" data-pptx-bounds="90 204 1040 148.2"><text x="90" y="298" fill="#12232F" font-size="84" font-family="Georgia" font-weight="bold" data-pptx-carrier="true">The case for boring.</text></g>
<g id="br-essay-p4" data-pptx-placeholder="subtitle" data-pptx-idx="4" data-pptx-bounds="90 342 920 120"><text x="90" y="370.16" fill="#5F6E79" font-size="32" font-family="Georgia" font-style="italic" data-pptx-carrier="true">The case for a strategy that survives<tspan x="90" dy="44">contact with the calendar.</tspan></text></g>
<g id="br-essay-p5" data-pptx-placeholder="body" data-pptx-idx="5" data-pptx-bounds="90 480 760 37.7"><text x="90" y="502" fill="#5F6E79" font-size="14" font-weight="bold" letter-spacing="1.6" data-pptx-carrier="true">BY THE STRATEGY OFFICE · 6 MIN READ · OCTOBER 2026</text></g>
<line id="br-essay-d4" data-pptx-role="decoration" x1="90" y1="528" x2="1150" y2="528" stroke="#D5DCE1" stroke-width="1"/>
<g id="br-essay-p6" data-pptx-placeholder="body" data-pptx-idx="6" data-pptx-bounds="90 560 500 620"><text x="90" y="580.24" fill="#12232F" font-size="23" font-family="Georgia" data-pptx-carrier="true">The strategy industry has a weakness for<tspan x="90" dy="35">drama. Transformation programmes are</tspan><tspan x="90" dy="35">announced with the gravity of moon</tspan><tspan x="90" dy="35">landings, then quietly re-baselined when</tspan><tspan x="90" dy="35">the quarter turns. The result is a</tspan><tspan x="90" dy="35">familiar pattern: a bold diagnosis, a</tspan><tspan x="90" dy="35">crowded slide, and a second year that</tspan><tspan x="90" dy="35">looks much like the first.</tspan><tspan x="90" dy="35"> </tspan><tspan x="90" dy="35">The alternative is less photogenic. Pick</tspan><tspan x="90" dy="35">a small number of moves that change how</tspan><tspan x="90" dy="35">work actually flows, assign one owner to</tspan><tspan x="90" dy="35">each, and measure them every month until</tspan><tspan x="90" dy="35">the behaviour sticks. Call it boring if</tspan><tspan x="90" dy="35">you like. Boring compounds.</tspan></text></g>
<g id="br-essay-p7" data-pptx-placeholder="body" data-pptx-idx="7" data-pptx-bounds="624 560 500 620"><text x="624" y="580.24" fill="#12232F" font-size="23" font-family="Georgia" data-pptx-carrier="true">That is the bet in this review. Three<tspan x="624" dy="35">moves — simplify the portfolio, rebuild</tspan><tspan x="624" dy="35">decision rights, reset the operating</tspan><tspan x="624" dy="35">rhythm — are unglamorous individually.</tspan><tspan x="624" dy="35">Together they close a 4.2-point margin</tspan><tspan x="624" dy="35">gap and take twenty-three days out of</tspan><tspan x="624" dy="35">every launch.</tspan><tspan x="624" dy="35"> </tspan><tspan x="624" dy="35">The test is not whether the plan sounds</tspan><tspan x="624" dy="35">ambitious. It is whether the</tspan><tspan x="624" dy="35">organisation can repeat it without a</tspan><tspan x="624" dy="35">programme office standing over it.</tspan><tspan x="624" dy="35">Discipline, not drama, is the strategy.</tspan><tspan x="624" dy="35">The board will know within one quarter</tspan><tspan x="624" dy="35">whether the habit has taken.</tspan></text></g>
<line id="br-essay-d5" data-pptx-role="decoration" x1="607" y1="560" x2="607" y2="1200" stroke="#D5DCE1" stroke-width="1"/>
<rect id="br-essay-d6" data-pptx-role="decoration" x="90" y="1244" width="6" height="140" fill="#E3120B"/>
<g id="br-essay-p8" data-pptx-placeholder="body" data-pptx-idx="8" data-pptx-bounds="120 1248 980 150"><text x="120" y="1281.44" fill="#071C2C" font-size="38" font-family="Georgia" font-style="italic" data-pptx-carrier="true">“Boring is not a lack of ambition.<tspan x="120" dy="50">It is ambition with a schedule.”</tspan></text></g>
<g id="br-essay-p9" data-pptx-placeholder="body" data-pptx-idx="9" data-pptx-bounds="120 1412 900 37.7"><text x="120" y="1434" fill="#5F6E79" font-size="14" font-weight="bold" letter-spacing="1.6" data-pptx-carrier="true">THE STRATEGY OFFICE / FOR THE BOARD, OCTOBER 2026</text></g>
