<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theme 增强模块 · 组件演示</title><link rel="stylesheet" href="/theme-extension/panel.css"><style>body{margin:0;background:#EDEFF5;font:16px Arial,"PingFang SC",sans-serif;color:#1D263A}main{max-width:1120px;margin:40px auto;padding:0 24px}.demo-banner{padding:18px 24px;border-radius:12px;background:#FFF3D8;color:#67531B;font-size:14px;line-height:1.7;margin-bottom:26px}.section{padding:28px;background:white;border-radius:18px}.section-head{font-size:24px;font-weight:700;display:flex;align-items:center;gap:14px}.section-num{display:inline-grid;place-items:center;width:38px;height:38px;background:#E8F0FF;color:#315FC4;border-radius:50%}.native{border:1px solid #DDE2ED;padding:20px;border-radius:12px;margin-top:18px}.native label{font-size:13px;color:#69758F}select{width:100%;padding:14px;border:1px solid #CCD3E1;border-radius:7px;margin-top:8px;font-size:14px}button{font-family:inherit}.native-choice{padding:12px 18px;border:1px solid #D6DCE9;border-radius:8px;background:white;cursor:pointer}.native-choice[aria-pressed=true]{border-color:#4285F4;background:#EDF4FF}.demo-footer{margin:25px 0;font-size:13px;line-height:1.8;color:#68758E}.demo-footer button{width:100%;padding:16px;border:0;border-radius:10px;background:#BFC8D9;color:#46536F}.demo-palette-native{display:flex;gap:12px;margin:20px 0}.color-card{cursor:pointer;padding:14px;background:#FFF;border:1px solid #DDE2ED;border-radius:9px}.color-card.selected{border:2px solid #315FC4}.color-name{font-size:13px}</style></head><body><main><div class="demo-banner"><strong>组件演示 · 不提交沟通契约。</strong>此处同时演示第 4 部分的主题入口，以及 Stage 2 才展开的色彩证据与素材记录。正式运行仍保留 PPT Master 的两阶段顺序。</div><div id="sections"><div class="section"><div class="section-head"><span class="section-num">4</span><span>设计基础 <small style="font-size:14px;font-weight:400;color:#758098">选择作品如何建立设计系统</small></span></div><div id="template-selector-panel" class="native"><label>保留原生选择控件</label><p><button id="template-free-choice" class="native-choice" aria-pressed="true">根据内容从零设计</button> <button id="template-use-choice" class="native-choice" aria-pressed="false">使用模板</button></p><label for="template-select-explicit">指定工作区</label><select id="template-select-explicit"><option value="">无</option></select></div></div></div><div class="demo-palette-native"><div class="color-card"><span class="color-name">YLMUN 蓝金 × 暖白纸面</span></div><div class="color-card"><span class="color-name">清迈深绿 × 摄影长篇</span></div></div><div class="demo-footer">主题面板只增强展示与联动。正式版的提交、校验、选择记录与模板安装仍由原生流程处理。<button disabled>组件演示模式：不会写入确认记录</button></div></main><script>fetch('/theme-extension/context').then(r=>r.json()).then(c=>{const o=document.createElement('option');o.value=c.theme.workspace_root;o.textContent=c.theme.name+' · Theme → Style';document.getElementById('template-select-explicit').append(o);const free=document.getElementById('template-free-choice'),use=document.getElementById('template-use-choice');free.onclick=()=>{free.setAttribute('aria-pressed','true');use.setAttribute('aria-pressed','false');document.getElementById('template-select-explicit').value=''};use.onclick=()=>{use.setAttribute('aria-pressed','true');free.setAttribute('aria-pressed','false')};document.querySelectorAll('.color-card').forEach(x=>x.onclick=()=>{document.querySelectorAll('.color-card').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});const s=document.createElement('script');s.src='/theme-extension/panel.js';document.body.append(s)});</script></body></html>
